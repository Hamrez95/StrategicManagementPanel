services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: stratino
      POSTGRES_USER: stratino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U stratino -d stratino]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [private]
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
    networks: [private]
  api:
    build: ../apps/api
    environment:
      STRATINO_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a local session secret}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_HOST: db
      EMAIL_HOST: mailpit
      STRATINO_PRIVATE_FILES: /private-files
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    volumes:
      - private-files:/private-files
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
networks:
  private:
    internal: true
volumes:
  database:
  private-files:
