name: Management knowledge integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:knowledge
      - run: npm run test:knowledge
      - name: Check the immutable first-slice release for drift
        run: npm run check:knowledge-release
      - name: Test release builder and package reader
        run: |
          npm run test:knowledge-release
          PYTHONPATH=apps/api python -m unittest discover -s apps/api/modules/knowledge/tests -v
      - name: Research generator must preserve committed research
        run: |
          node assets/management-knowledge/validation/validate.mjs
          git diff --exit-code -- assets/management-knowledge
