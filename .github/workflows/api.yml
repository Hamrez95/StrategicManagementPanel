name: API foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: stratino-ci
      POSTGRES_PASSWORD: synthetic-local-ci-only-password
      DJANGO_SECRET_KEY: synthetic-local-ci-only-key-with-many-characters-never-use-in-production-58310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify packaged API reference resources
        run: node scripts/sync-api-resources.mjs --check
      - name: Build, migrate and test against PostgreSQL
        run: |
          docker compose -f infra/compose.dev.yml config --quiet
          docker compose -f infra/compose.dev.yml build api
          docker compose -f infra/compose.dev.yml up -d --wait db mailpit
          docker compose -f infra/compose.dev.yml run --rm api python manage.py migrate --noinput
          docker compose -f infra/compose.dev.yml run --rm api python manage.py migrate --check
          docker compose -f infra/compose.dev.yml run --rm api python manage.py makemigrations --check --dry-run
          docker compose -f infra/compose.dev.yml run --rm api python manage.py audit_model_integrity --summary
          docker compose -f infra/compose.dev.yml run --rm api python manage.py check
          docker compose -f infra/compose.dev.yml run --rm api python manage.py test --noinput
          docker compose -f infra/compose.dev.yml run --rm -e STRATINO_ENV=production -e DJANGO_DEBUG=0 -e DJANGO_ALLOWED_HOSTS=example.invalid -e STRATINO_PUBLIC_URL=https://example.invalid -e DJANGO_CSRF_TRUSTED_ORIGINS=https://example.invalid api python manage.py check --deploy --fail-level WARNING
      - name: HTTP readiness, private file persistence and local email
        run: |
          docker compose -f infra/compose.dev.yml up -d --wait api
          curl --fail http://127.0.0.1:8000/api/v1/health/ready
          docker compose -f infra/compose.dev.yml exec -T api python scripts/smoke.py write
          docker compose -f infra/compose.dev.yml restart api
          docker compose -f infra/compose.dev.yml up -d --wait api
          docker compose -f infra/compose.dev.yml exec -T api python scripts/smoke.py read
      - name: Consistent backup and isolated database/file restore
        shell: pwsh
        run: |
          $dbId = docker compose -f infra/compose.dev.yml ps -q db
          $apiId = docker compose -f infra/compose.dev.yml ps -q api
          ./scripts/backup-recovery.ps1 -DbContainer $dbId -ApiContainer $apiId -OutputDirectory "$PWD/.local-backups/ci-recovery" -StopApiForSnapshot -TestRestore
          $receipt = Get-Content .local-backups/ci-recovery/receipt.json -Raw | ConvertFrom-Json
          if (-not $receipt.restore_verified -or $receipt.files.files -lt 1 -or $receipt.restored_files.files -ne $receipt.files.files) { throw 'Nonempty private-file recovery was not proved' }
          docker compose -f infra/compose.dev.yml exec -T api python scripts/smoke.py read
      - name: Stop owned CI services
        if: always()
        run: docker compose -f infra/compose.dev.yml down --volumes
  runner:
    name: PowerShell two-ref runtime
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      # Exercise both build modes from the candidate, not obsolete dependencies on an old branch.
      - run: git branch -f feat/stratino-academy HEAD
      - name: Real Compose volumes, proxy readiness, cleanup and repeated run
        shell: pwsh
        run: ./scripts/test-full-stack-runner.ps1
