name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-host:
    name: Shared host isolation and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-shared-host.mjs
      - run: python3 -m unittest discover -s infra/shared-host -p test_host.py -v
      - name: Validate the actual Compose model without production secrets
        run: |
          mkdir -p "$RUNNER_TEMP/businesses-fixture"
          touch "$RUNNER_TEMP/businesses-fixture/stratino-api.env" "$RUNNER_TEMP/businesses-fixture/stratino-db.env" "$RUNNER_TEMP/businesses-fixture/mazeduneh-api.env" "$RUNNER_TEMP/businesses-fixture/mazeduneh-db.env"
          HOST_SECRETS_DIR="$RUNNER_TEMP/businesses-fixture" STRATINO_RELEASE="$GITHUB_SHA" MAZEDUNEH_RELEASE="$GITHUB_SHA" docker compose -f infra/shared-host/compose.yaml config --quiet
      - name: Validate actual Caddy syntax on the CI runner
        run: >-
          docker run --rm
          -v "$PWD/infra/shared-host:/host:ro"
          -v "$PWD/infra/shared-host/cloudflare-trust.caddy:/etc/caddy/cloudflare-trust.caddy:ro"
          caddy:2.10.2-alpine caddy adapt --config /host/Caddyfile --validate > /dev/null
  frontend:
    name: Static and contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release-builder tests verify the pinned knowledge commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:deployment
      - run: npm audit --audit-level=high
      - run: npm run quality
      - run: npm run test:gate
  browser:
    name: Browser and UI gate
    needs: frontend
    runs-on: ubuntu-latest
    # Browser installation plus the complete registered suite can exceed 15 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser:all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: synthetic-browser-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: |
            test-results/ui/*.png
            test-results/ui/report.json
            test-results/web/*.png
            test-results/web/*.json
            test-results/global-admin/
            test-results/motion/
            test-results/management-studio/
