name: Build shared-host release package
on:
  workflow_dispatch:
    inputs:
      mazeduneh_commit:
        description: Full reviewed Mazeduneh commit SHA (40 lowercase hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require an immutable Mazeduneh release
        env:
          MAZEDUNEH_COMMIT: ${{ inputs.mazeduneh_commit }}
        run: '[[ "$MAZEDUNEH_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: stratino
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Hamrez95/Mazeduneh
          ref: ${{ inputs.mazeduneh_commit }}
          path: mazeduneh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Package only committed source
        run: node stratino/scripts/bundle-shared-host.mjs "$GITHUB_WORKSPACE/mazeduneh" "$RUNNER_TEMP/release" python3
      - name: Build production images sequentially without runtime credentials
        env:
          STRATINO_RELEASE: ${{ github.sha }}
          MAZEDUNEH_RELEASE: ${{ inputs.mazeduneh_commit }}
          HOST_SECRETS_DIR: ${{ runner.temp }}/private-fixture
        run: |
          mkdir -p "$HOST_SECRETS_DIR"
          touch "$HOST_SECRETS_DIR/stratino-api.env" "$HOST_SECRETS_DIR/stratino-db.env" "$HOST_SECRETS_DIR/mazeduneh-api.env" "$HOST_SECRETS_DIR/mazeduneh-db.env"
          docker compose --parallel 1 -f "$RUNNER_TEMP/release/compose.yaml" build --pull
          docker save -o "$RUNNER_TEMP/images.tar" "stratino-web:$STRATINO_RELEASE" "stratino-api:$STRATINO_RELEASE" "stratino-db:$STRATINO_RELEASE" "mazeduneh-web:$MAZEDUNEH_RELEASE" "mazeduneh-api:$MAZEDUNEH_RELEASE" "mazeduneh-admin:$MAZEDUNEH_RELEASE"
          gzip "$RUNNER_TEMP/images.tar"
          tar -czf "$RUNNER_TEMP/shared-release.tar.gz" -C "$RUNNER_TEMP" release
          cd "$RUNNER_TEMP"
          sha256sum images.tar.gz shared-release.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shared-host-release
          retention-days: 3
          path: |
            ${{ runner.temp }}/images.tar.gz
            ${{ runner.temp }}/shared-release.tar.gz
            ${{ runner.temp }}/SHA256SUMS
