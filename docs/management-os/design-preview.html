<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Startino — initial design preview</title>
    <style>
      @font-face {
        font-family: Vazirmatn;
        src: url('../../public/assets/vazirmatn.woff2') format('woff2');
        font-display: swap;
      }
      :root {
        --canvas: #f8fafc;
        --surface: #fff;
        --ink: #172b4d;
        --muted: #526277;
        --line: #c8d1df;
        --control: #718198;
        --action: #2459ed;
        --accent: #0f766e;
        --soft: #eef3fb;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        --canvas: #101827;
        --surface: #1a2639;
        --ink: #ecf1fa;
        --muted: #b5c3d6;
        --line: #44546c;
        --control: #94a3b8;
        --action: #adc4ff;
        --accent: #8ee0cc;
        --soft: #24344d;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font:
          16px/1.8 Vazirmatn,
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select,
      input {
        min-height: 44px;
        border: 1px solid var(--control);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        padding: 8px 12px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: var(--soft);
      }
      :focus-visible {
        outline: 3px solid var(--action);
        outline-offset: 3px;
      }
      .toolbar {
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        background: var(--surface);
      }
      .toolbar strong {
        margin-inline-end: auto;
      }
      .toolbar label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .notice {
        margin: 0;
        padding: 8px 20px;
        background: var(--soft);
        font-size: 14px;
        color: var(--muted);
      }
      .shell {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        max-width: 1600px;
        margin: auto;
        min-height: calc(100vh - 140px);
      }
      aside {
        border-inline-end: 1px solid var(--line);
        padding: 24px 16px;
      }
      aside h2 {
        font-size: 18px;
        margin: 0 0 20px;
      }
      aside nav {
        display: grid;
        gap: 8px;
      }
      aside button {
        text-align: start;
        border-color: transparent;
        background: transparent;
      }
      aside button.active {
        background: var(--soft);
        border-color: var(--line);
        font-weight: 700;
      }
      main {
        padding: 28px 32px;
        min-width: 0;
      }
      .scope {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 14px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
      }
      .heading {
        display: flex;
        align-items: start;
        gap: 20px;
        margin: 24px 0;
      }
      .heading > div {
        flex: 1;
      }
      .heading p {
        color: var(--muted);
        max-width: 72ch;
        margin: 4px 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.5;
        margin: 0;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      .primary {
        background: var(--action);
        border-color: var(--action);
        color: #fff;
      }
      html[data-theme='dark'] .primary {
        color: #102040;
      }
      .primary:hover {
        filter: brightness(0.95);
        background: var(--action);
      }
      .panel {
        background: var(--surface);
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        margin-block: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 20px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border: 0;
      }
      .row p {
        margin: 4px 0;
        color: var(--muted);
      }
      .tag {
        display: inline-block;
        border: 1px solid var(--line);
        padding: 2px 8px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 14px;
      }
      .evidence {
        color: var(--accent);
      }
      .label {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .result {
        font-size: 24px;
        font-weight: 700;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .fields label {
        display: grid;
        gap: 6px;
      }
      .fields .wide {
        grid-column: 1/-1;
      }
      input {
        width: 100%;
        min-width: 0;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        border-top: 1px solid var(--line);
        padding-top: 20px;
        margin-top: 20px;
      }
      .quiet {
        color: var(--muted);
      }
      details {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 16px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        min-height: 44px;
      }
      .tablewrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 520px;
        text-align: start;
      }
      th,
      td {
        padding: 14px 12px;
        border-bottom: 1px solid var(--line);
        text-align: start;
      }
      th {
        font-size: 14px;
        color: var(--muted);
      }
      ul,
      ol {
        padding-inline-start: 24px;
      }
      .trace {
        border-inline-start: 3px solid var(--accent);
        padding-inline-start: 16px;
      }
      .mode-compact .coaching {
        display: none;
      }
      .stage-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stage-list span {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .mobile-preview .shell {
        display: block;
        width: 360px;
        max-width: 100%;
        border-inline: 1px solid var(--line);
        margin: 12px auto;
      }
      .mobile-preview aside {
        display: none;
      }
      .mobile-preview main {
        padding: 20px 16px;
      }
      .mobile-preview .grid,
      .mobile-preview .fields {
        grid-template-columns: 1fr;
      }
      .mobile-preview .heading {
        display: block;
      }
      .mobile-preview .heading button {
        margin-top: 16px;
      }
      .mobile-preview .panel {
        padding: 16px;
      }
      .mobile-preview h1 {
        font-size: 24px;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        color: var(--ink);
        padding: 24px;
        max-width: 480px;
        width: calc(100% - 32px);
      }
      dialog::backdrop {
        background: #0008;
      }
      dialog button {
        margin-top: 16px;
      }
      #feedback {
        position: fixed;
        bottom: 16px;
        inset-inline: 20px;
        max-width: 600px;
        margin: auto;
        background: var(--ink);
        color: var(--surface);
        padding: 12px 20px;
        border-radius: 10px;
        z-index: 3;
      }
      #feedback:empty {
        display: none;
      }
      .skeleton {
        height: 20px;
        background: var(--soft);
        border-radius: 6px;
        margin: 18px 0;
      }
      .skeleton:nth-child(2) {
        width: 75%;
      }
      .error {
        border-inline-start: 4px solid #ba3e3e;
        padding: 16px;
        background: var(--surface);
      }
      @media (max-width: 767px) {
        .shell {
          display: block;
        }
        aside {
          display: none;
        }
        main {
          padding: 20px 16px;
        }
        .grid,
        .fields {
          grid-template-columns: 1fr;
        }
        .heading {
          display: block;
        }
        .heading button {
          margin-top: 16px;
        }
        .panel {
          padding: 16px;
        }
        h1 {
          font-size: 24px;
        }
        .toolbar {
          padding: 12px;
        }
        .toolbar label:first-of-type {
          width: 100%;
        }
        .toolbar select {
          max-width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <strong id="brand">استراتینو • طرح اولیه</strong
      ><label
        ><span id="page-label">صفحه</span
        ><select id="page"></select></label
      ><label
        ><span id="state-label">حالت</span
        ><select id="state">
          <option value="default">Default</option>
          <option value="empty">Empty</option>
          <option value="loading">Loading</option>
          <option value="error">Error</option>
          <option value="conflict">Conflict</option>
        </select></label
      ><button id="lang">English</button><button id="theme">روشن / تیره</button
      ><button id="mode">هدایت‌شده / فشرده</button><button id="viewport">۳۶۰px</button>
    </header>
    <p class="notice" id="preview-note"></p>
    <div class="shell">
      <aside>
        <h2 id="business"></h2>
        <nav id="nav"></nav>
        <p class="quiet" id="account-note"></p>
      </aside>
      <main id="main"></main>
    </div>
    <dialog id="why">
      <h2 id="why-title"></h2>
      <div id="why-body"></div>
      <button id="close-why"></button>
    </dialog>
    <div id="feedback" role="status"></div>
    <script>
      const pages = [
        [

        ],
        ['P02', 'ساخت حساب', 'Create account', 'auth', 'ساخت حساب', 'Create account'],

        ['P04', 'ورود به حساب', 'Sign in', 'auth', 'ورود', 'Sign in'],
        [

        [
          'P07',
          'نمای مدیریتی',
          'Operating overview',

          'بررسی گام بعدی',
          'Review next step',
        ],
        [
          'P08',
          'شناخت وضعیت فعلی',

        ],
        [
          'P09',

          'Save and continue',
        ],
        ['P11', 'شناخت شرکت', 'Business profile', 'profile', 'ذخیره تغییرات', 'Save changes'],
        ['P12', 'مشتری و بخش هدف', 'ICP and segment', 'profile', 'ثبت شاهد', 'Add evidence'],
        ['P13', 'شاخص‌های کسب‌وکار', 'Business metrics', 'metrics', 'بررسی شاخص', 'Review metric'],
        [
          'P14',
          'جزئیات شاخص',
          'Metric detail',
          'metric',
          'محاسبه با ورودی معتبر',

        ],
        ['P15', 'شواهد و ادعاها', 'Evidence and claims', 'evidence', 'ثبت شاهد', 'Add evidence'],
        ['P16', 'بررسی شاهد', 'Evidence review', 'evidence', 'ثبت بازبینی', 'Record review'],
        [
          'P17',
          'موارد نیازمند توجه',
          'Needs attention',
          'insights',
          'بررسی پیشنهاد',
          'Review candidate',
        ],
        [
          'P18',
          'چرا این پیشنهاد؟',
          'Why this candidate?',
          'why',
          'ثبت تصمیم و اقدام',
          'Record decision and action',
        ],
        ['P19', 'دفتر تصمیم', 'Decision journal', 'execution', 'ثبت تصمیم', 'Record decision'],
        ['P20', 'برنامه اجرا', 'Execution plan', 'execution', 'ثبت اقدام', 'Create action'],
        [
          'P21',

        ],
        ['P22', 'بازبینی مدیریتی', 'Management reviews', 'reviews', 'شروع بازبینی', 'Start review'],
        [
          'P23',
          'جزئیات بازبینی',
          'Review detail',
          'review',
          'ثبت نتایج بازبینی',
          'Record review outcomes',
        ],
        ['P24', 'ریسک‌ها', 'Risks', 'execution', 'بررسی ریسک', 'Review risk'],
        [
          'P25',
          'گزینه‌های راهبردی',
          'SWOT and options',
          'analysis',
          'بررسی گزینه',

        ],
        ['P26', 'آزمایشگاه ماتریس‌ها', 'Matrix studio', 'analysis', 'ثبت پیش‌نویس', 'Save draft'],
        [
          'P27',
          'محیط و صنعت',

        ],
        [

        ],
        [

          'Business economics',
          'metric',

          'Review calculation',
        ],
        ['P30', 'سناریو و آینده', 'Scenario lab', 'scenario', 'مقایسه سناریو', 'Compare scenario'],
        ['P31', 'کتابخانه مدارک', 'Document library', 'documents', 'ذخیره پیش‌نویس', 'Save draft'],
        [
          'P32',
          'گزارش مدیریتی',
          'Management reports',
          'reports',
          'ساخت تصویر ثابت گزارش',
          'Create snapshot',
        ],
        ['P33', 'کتابخانه یادگیری', 'Learning library', 'learn', 'بازکردن مفهوم', 'Open concept'],
        ['P34', 'جست‌وجوی مجاز', 'Permitted search', 'search', 'جست‌وجو', 'Search'],
        [
          'P35',
          'ورود اطلاعات موجود',
          'Import existing data',
          'import',
          'بررسی پیش‌نمایش',
          'Review preview',
        ],
        [
          'P36',
          'تنظیمات کسب‌وکار',
          'Workspace settings',
          'settings',
          'ذخیره تغییرات',
          'Save changes',
        ],
        [
          'P37',
          'حساب و ترجیحات',
          'Account preferences',
          'account',
          'ذخیره تنظیمات',
          'Save preferences',
        ],
        [
          'P38',
          'اشتراک و سهمیه',
          'Subscription and quota',
          'billing',
          'بررسی وضعیت واقعی',
          'Review actual status',
        ],
        [
          'P39',
          'اعلان‌ها',
          'Notifications',
          'notifications',
          'بررسی تنظیمات',
          'Review preferences',
        ],
        ['P40', 'کنسول داخلی', 'Operator console', 'operator', 'بررسی دسترسی', 'Check permission'],
      ];
      let language = 'fa',
        compact = false,
        dark = false;
      const $ = (id) => document.getElementById(id),
        t = (fa, en) => (language === 'fa' ? fa : en);
      const note = () =>
        `<p class="quiet">${t('این صفحه طرح اولیه است؛ اطلاعات واقعی یا نتیجه تأییدشده ندارد.', 'Design preview only; no actual business data or verified result.')}</p>`;
      const whyButton = () =>
        `<button data-why>${t('چرا این را می‌بینم؟', 'Why am I seeing this?')}</button>`;
      const row = (title, description, button = t('بررسی', 'Review'), target = 'P18') =>
        `<div class="row"><div><strong>${title}</strong><p>${description}</p></div><button data-page="${target}">${button}</button></div>`;
      const field = (fa, en, placeholder = t('هنوز ثبت نشده', 'Not provided')) =>
        `<label>${t(fa, en)}<input placeholder="${placeholder}"></label>`;
      const panel = (title, body) => `<section class="panel"><h2>${title}</h2>${body}</section>`;
      const unknown = () =>
        `<span class="tag">${t('اطلاعات ناکافی', 'Insufficient information')}</span>`;
      const table = (headers, rows) =>
        `<div class="tablewrap"><table><thead><tr>${headers.map((x) => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      function explanation() {
        return `<div class="trace"><h3>${t('بررسی شواهد تکرارپذیری پیش از توسعه جذب', 'Review repeatability evidence before broad acquisition')}</h3><p>${t('نامزد بررسی؛ نبود داده به معنی شکست کسب‌وکار نیست.', 'Candidate for review; missing data is not business failure.')}</p>${unknown()}</div>${row(t('شواهد مورد نیاز', 'Needed evidence'), t('تعریف گروه مشتری، بازه مشاهده و محدودیت داده', 'Cohort definition, observation window and limitations'), t('شواهد', 'Evidence'), 'P15')}<p>${t('اطمینان با دلیل هر محور نمایش داده می‌شود؛ درصد احتمال ساخته نمی‌شود.', 'Confidence has axis reasons; no success probability is invented.')}</p><details><summary>${t('منابع، قاعده و نسخه', 'Sources, rule and revision')}</summary><p>RULE-RETENTION-BEFORE-SCALE → REC-RETENTION-BEFORE-SCALE</p><p>${t('منشأ، ورودی و نسخه دانش در اجرای واقعی اینجا نمایش داده می‌شود.', 'The real run will show provenance, input and knowledge revision here.')}</p></details>`;
      }
      function content(p) {
        switch (p[3]) {
          case 'public':
            return panel(
              t('از شناخت تا اقدام قابل پیگیری', 'From understanding to an owned action'),
              `<p>${t('وضعیت کسب‌وکار، مسئله مهم و قدم بعد را با شواهد روشن کنید.', 'Clarify the situation, the relevant concern and the next step with evidence.')}</p><div class="stage-list">${[t('شناخت', 'Understand'), t('تشخیص', 'Diagnose'), t('تصمیم', 'Decide'), t('اجرا', 'Execute'), t('بازبینی', 'Review')].map((x) => `<span>${x}</span>`).join('')}</div>`,
            );
          case 'auth':
            return panel(
              t('حساب شخصی', 'Personal account'),
              `<div class="fields">${field('ایمیل', 'Email')}${p[0] === 'P03' ? '' : field('رمز عبور', 'Password')}</div><p>${t('ورود و تأیید واقعی از سرویس حساب انجام می‌شود.', 'Authentication and verification use the account service.')}</p>`,
            );
          case 'workspaces':
            return panel(
              t('تحت مالکیت / عضو', 'Owned / joined'),
              row(
                t('نمونه چیدمان کسب‌وکار', 'Business row layout'),
                t(
                  'نام، نقش و وضعیت بایگانی از داده واقعی',
                  'Actual business name, role and archive status',
                ),
                t('بازکردن', 'Open'),
                'P07',
              ) + note(),
            );
          case 'onboard':
            return panel(
              t('فقط اطلاعات شروع', 'Only initial context'),
              `<div class="fields">${field('نام پروژه یا کسب‌وکار *', 'Business or project name *')}${field('حوزه فعالیت — اختیاری', 'Industry — optional')}${field('هدف یا مسئله فعلی — اختیاری', 'Current goal or problem — optional')}</div><p>${t('اطلاعات تکمیلی را هنگام نیاز می‌پرسیم.', 'Additional information is requested when it changes a decision.')}</p>`,

          );

          timer = setTimeout(() => ($('feedback').textContent = ''), 4500);
        }
      });
      render();
    </script>
  </body>
</html>
