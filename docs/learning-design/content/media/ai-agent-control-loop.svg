<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">عامل AI و حلقهٔ کنترل انسانی</title><desc id="d">عامل می‌تواند چند گام را دنبال کند؛ دسترسی و اختیار باید محدود و قابل‌بازگشت باشد. درخواست و دامنه: هدف، منابع داده، ابزار مجاز و کارهای ممنوع را تعریف کن.؛ پیشنهاد و اقدام: عملیات کم‌خطر را محدود کن؛ برای تعهد، پرداخت یا دادهٔ حساس تأیید بگیر.؛ پایش و ثبت: عملکرد، خطا، دسترسی و شکایت را با مالک مشخص پایش کن.؛ توقف و بازیابی: کلید توقف، لغو دسترسی، بازگشت به نسخهٔ قبلی و مسئول پاسخ را آماده کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">عامل AI و حلقهٔ کنترل انسانی</text><text x="1150" y="86" text-anchor="end" class="sub">عامل می‌تواند چند گام را دنبال کند؛ دسترسی و اختیار باید محدود و قابل‌بازگشت باشد.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">درخواست و دامنه</text><text x="1116" y="240" text-anchor="end" class="b">هدف، منابع داده، ابزار</text><text x="1116" y="270" text-anchor="end" class="b">مجاز و کارهای ممنوع</text><text x="1116" y="300" text-anchor="end" class="b">را تعریف کن.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">پیشنهاد و اقدام</text><text x="556" y="240" text-anchor="end" class="b">عملیات کم‌خطر را محدود</text><text x="556" y="270" text-anchor="end" class="b">کن؛ برای تعهد، پرداخت</text><text x="556" y="300" text-anchor="end" class="b">یا دادهٔ حساس تأیید</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">پایش و ثبت</text><text x="1116" y="470" text-anchor="end" class="b">عملکرد، خطا، دسترسی</text><text x="1116" y="500" text-anchor="end" class="b">و شکایت را با مالک</text><text x="1116" y="530" text-anchor="end" class="b">مشخص پایش کن.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">توقف و بازیابی</text><text x="556" y="470" text-anchor="end" class="b">کلید توقف، لغو دسترسی،</text><text x="556" y="500" text-anchor="end" class="b">بازگشت به نسخهٔ قبلی</text><text x="556" y="530" text-anchor="end" class="b">و مسئول پاسخ را آماده</text></g><text x="1150" y="674" text-anchor="end" class="foot">خودمختاری را با ریسک، شدت اثر و امکان لغو کاهش یا افزایش بده؛ پایلوت را کنترل‌شده اجرا کن.</text></svg>
