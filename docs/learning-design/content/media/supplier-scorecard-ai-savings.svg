<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">ارزیابی و توسعهٔ تأمین‌کننده</title><desc id="d">امتیاز عملکرد فقط وقتی مفید است که تعریف شاخص، خط مبنا و مالک اقدام روشن باشد. کارت امتیاز: کیفیت، تحویل، پاسخ‌گویی و ریسک را با تعریف و دورهٔ مشخص بسنج.؛ AI با مرز روشن: خلاصه‌سازی و کشف الگو را کمک‌یار کن؛ مذاکره یا تصمیم حساس را خودکار رها نکن.؛ صرفه‌جویی معتبر: قیمت پایه، حجم، ترکیب کالا و کیفیت را کنترل کن تا اثرها قاطی نشوند.؛ برنامهٔ توسعه: شکاف، اقدام مشترک، مسئول، موعد و سنجهٔ بازبینی را ثبت کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">ارزیابی و توسعهٔ تأمین‌کننده</text><text x="1150" y="86" text-anchor="end" class="sub">امتیاز عملکرد فقط وقتی مفید است که تعریف شاخص، خط مبنا و مالک اقدام روشن باشد.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">کارت امتیاز</text><text x="1116" y="240" text-anchor="end" class="b">کیفیت، تحویل، پاسخ‌گویی</text><text x="1116" y="270" text-anchor="end" class="b">و ریسک را با تعریف و</text><text x="1116" y="300" text-anchor="end" class="b">دورهٔ مشخص بسنج.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">AI با مرز روشن</text><text x="556" y="240" text-anchor="end" class="b">خلاصه‌سازی و کشف الگو</text><text x="556" y="270" text-anchor="end" class="b">را کمک‌یار کن؛ مذاکره</text><text x="556" y="300" text-anchor="end" class="b">یا تصمیم حساس را خودکار</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">صرفه‌جویی معتبر</text><text x="1116" y="470" text-anchor="end" class="b">قیمت پایه، حجم، ترکیب</text><text x="1116" y="500" text-anchor="end" class="b">کالا و کیفیت را کنترل</text><text x="1116" y="530" text-anchor="end" class="b">کن تا اثرها قاطی نشوند.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">برنامهٔ توسعه</text><text x="556" y="470" text-anchor="end" class="b">شکاف، اقدام مشترک،</text><text x="556" y="500" text-anchor="end" class="b">مسئول، موعد و سنجهٔ</text><text x="556" y="530" text-anchor="end" class="b">بازبینی را ثبت کن.</text></g><text x="1150" y="674" text-anchor="end" class="foot">امتیاز مرکب وزن‌محور است و می‌تواند تفاوت‌ها را پنهان کند؛ نتیجه را با دادهٔ خام هم ببین.</text></svg>
