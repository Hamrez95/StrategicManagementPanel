<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">مذاکرهٔ چندطرفه و ائتلاف</title><desc id="d">منافع را پشت موضع‌ها پیدا کن؛ توافق فقط با جمع‌کردن خواسته‌ها ساخته نمی‌شود. ۱ | طرف‌ها و منابع: هر طرف را با اختیار، اطلاعات، زمان یا منبعی که وارد مذاکره می‌کند بشناس.؛ ۲ | منافع و اولویت‌ها: موضع را از منفعت جدا کن؛ یک موضوع ممکن است برای دو طرف ارزش متفاوتی داشته باشد.؛ ۳ | پیوندهای ائتلاف: ائتلاف‌ها موقت‌اند؛ هم‌سویی در یک موضوع، توافق در موضوع دیگر را تضمین نمی‌کند.؛ ۴ | بستهٔ مشترک: چند موضوع را کنار هم بگذار، گزینه بساز و پیامد هر گزینه برای همه را بسنج.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">مذاکرهٔ چندطرفه و ائتلاف</text><text x="1150" y="86" text-anchor="end" class="sub">منافع را پشت موضع‌ها پیدا کن؛ توافق فقط با جمع‌کردن خواسته‌ها ساخته نمی‌شود.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">۱ | طرف‌ها و منابع</text><text x="1116" y="240" text-anchor="end" class="b">هر طرف را با اختیار،</text><text x="1116" y="270" text-anchor="end" class="b">اطلاعات، زمان یا منبعی</text><text x="1116" y="300" text-anchor="end" class="b">که وارد مذاکره می‌کند</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">۲ | منافع و اولویت‌ها</text><text x="556" y="240" text-anchor="end" class="b">موضع را از منفعت جدا</text><text x="556" y="270" text-anchor="end" class="b">کن؛ یک موضوع ممکن است</text><text x="556" y="300" text-anchor="end" class="b">برای دو طرف ارزش</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">۳ | پیوندهای ائتلاف</text><text x="1116" y="470" text-anchor="end" class="b">ائتلاف‌ها موقت‌اند؛</text><text x="1116" y="500" text-anchor="end" class="b">هم‌سویی در یک موضوع،</text><text x="1116" y="530" text-anchor="end" class="b">توافق در موضوع دیگر</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">۴ | بستهٔ مشترک</text><text x="556" y="470" text-anchor="end" class="b">چند موضوع را کنار هم</text><text x="556" y="500" text-anchor="end" class="b">بگذار، گزینه بساز و</text><text x="556" y="530" text-anchor="end" class="b">پیامد هر گزینه برای</text></g><text x="1150" y="674" text-anchor="end" class="foot">نقشه ابزار کشف گزینه است؛ تعداد طرف‌ها یا قدرت ظاهری به‌تنهایی نتیجه را پیش‌بینی نمی‌کند.</text></svg>
