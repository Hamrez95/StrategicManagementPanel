<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">راهبرد دیجیتال تا مدل عملیاتی</title><desc id="d">فناوری وقتی ارزش می‌سازد که هدف، فرایند، نقش و سنجه با هم تغییر کنند. هدف کسب‌وکار: نتیجهٔ مورد انتظار را بنویس؛ «دیجیتالی‌شدن» به‌تنهایی معیار موفقیت نیست.؛ فرایند و تجربه: گلوگاه یا اصطکاک کاربر را پیدا کن؛ فرایند بد را صرفاً سریع‌تر نکن.؛ قابلیت و نقش: داده، مهارت، مالک تصمیم و هماهنگی بین واحدها را مشخص کن.؛ سنجش و آمادگی: خط مبنا، کیفیت، هزینه و ریسک را پیش از پایلوت تعیین و پس از اجرا بازبینی کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">راهبرد دیجیتال تا مدل عملیاتی</text><text x="1150" y="86" text-anchor="end" class="sub">فناوری وقتی ارزش می‌سازد که هدف، فرایند، نقش و سنجه با هم تغییر کنند.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">هدف کسب‌وکار</text><text x="1116" y="240" text-anchor="end" class="b">نتیجهٔ مورد انتظار را</text><text x="1116" y="270" text-anchor="end" class="b">بنویس؛ «دیجیتالی‌شدن»</text><text x="1116" y="300" text-anchor="end" class="b">به‌تنهایی معیار موفقیت</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">فرایند و تجربه</text><text x="556" y="240" text-anchor="end" class="b">گلوگاه یا اصطکاک کاربر</text><text x="556" y="270" text-anchor="end" class="b">را پیدا کن؛ فرایند بد</text><text x="556" y="300" text-anchor="end" class="b">را صرفاً سریع‌تر نکن.</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">قابلیت و نقش</text><text x="1116" y="470" text-anchor="end" class="b">داده، مهارت، مالک</text><text x="1116" y="500" text-anchor="end" class="b">تصمیم و هماهنگی بین</text><text x="1116" y="530" text-anchor="end" class="b">واحدها را مشخص کن.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">سنجش و آمادگی</text><text x="556" y="470" text-anchor="end" class="b">خط مبنا، کیفیت، هزینه</text><text x="556" y="500" text-anchor="end" class="b">و ریسک را پیش از پایلوت</text><text x="556" y="530" text-anchor="end" class="b">تعیین و پس از اجرا</text></g><text x="1150" y="674" text-anchor="end" class="foot">نقشهٔ تحول فرضیهٔ اجرایی می‌سازد؛ اثر باید با دادهٔ همان سازمان سنجیده شود.</text></svg>
