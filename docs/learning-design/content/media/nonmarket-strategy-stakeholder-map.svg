<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">راهبرد غیربازاری و مشروعیت</title><desc id="d">تصمیم بیرون از بازار به نهادها، ذی‌نفعان، قواعد و اعتماد عمومی وابسته است. مسئله و نهاد: موضوع عمومی و اختیار رسمی را شناسایی کن؛ مقررهٔ جاری را از تحلیل عمومی جدا کن.؛ ذی‌نفع و موضع: اثر، منفعت و میزان صدای گروه‌ها را ثبت کن؛ مخالف را فقط مانع فرض نکن.؛ پاسخ و ائتلاف: اقدام شفاف، گفت‌وگو و تعهد قابل‌سنجش را بسنج؛ تعارض منافع را آشکار کن.؛ مشروعیت و یادگیری: بازخورد و پیامد ناخواسته را پایش کن؛ موضع را با شواهد جدید بازنگری کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">راهبرد غیربازاری و مشروعیت</text><text x="1150" y="86" text-anchor="end" class="sub">تصمیم بیرون از بازار به نهادها، ذی‌نفعان، قواعد و اعتماد عمومی وابسته است.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">مسئله و نهاد</text><text x="1116" y="240" text-anchor="end" class="b">موضوع عمومی و اختیار</text><text x="1116" y="270" text-anchor="end" class="b">رسمی را شناسایی کن؛</text><text x="1116" y="300" text-anchor="end" class="b">مقررهٔ جاری را از</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">ذی‌نفع و موضع</text><text x="556" y="240" text-anchor="end" class="b">اثر، منفعت و میزان</text><text x="556" y="270" text-anchor="end" class="b">صدای گروه‌ها را ثبت</text><text x="556" y="300" text-anchor="end" class="b">کن؛ مخالف را فقط مانع</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">پاسخ و ائتلاف</text><text x="1116" y="470" text-anchor="end" class="b">اقدام شفاف، گفت‌وگو</text><text x="1116" y="500" text-anchor="end" class="b">و تعهد قابل‌سنجش را</text><text x="1116" y="530" text-anchor="end" class="b">بسنج؛ تعارض منافع را</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">مشروعیت و یادگیری</text><text x="556" y="470" text-anchor="end" class="b">بازخورد و پیامد ناخواسته</text><text x="556" y="500" text-anchor="end" class="b">را پایش کن؛ موضع را</text><text x="556" y="530" text-anchor="end" class="b">با شواهد جدید بازنگری</text></g><text x="1150" y="674" text-anchor="end" class="foot">مسیر قانونی و سیاسی به حوزهٔ فعالیت بستگی دارد؛ ادعا یا اقدام حقوقی را با متخصص همان حوزه بررسی کن.</text></svg>
