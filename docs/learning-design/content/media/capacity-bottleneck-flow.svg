<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">ظرفیت و گلوگاه</title><desc id="desc">نقشهٔ سه مرحلهٔ نمادین با نرخ ظرفیت C1 و C2 و C3؛ خروجی کل برابر کمترین ظرفیت است. مثال ظرفیت یک ایستگاه ۴۲۰ دقیقه تقسیم بر چرخهٔ دو دقیقه برابر ۲۱۰ واحد نظری است.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#68768A}.number{font-size:23px;font-weight:700}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1240" y="48" text-anchor="end" class="title">گلوگاه، خروجی کل زنجیره را محدود می‌کند</text><text x="1240" y="83" text-anchor="end" class="small">ظرفیت ایستگاه‌ها را با واحد و بازهٔ یکسان مقایسه کن.</text><rect x="920" y="145" width="250" height="125" rx="20" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2" filter="url(#shadow)"/><text x="1152" y="179" text-anchor="end" class="head">مرحلهٔ ۱</text><text x="1152" y="213" text-anchor="end" class="body">ظرفیت C₁</text><rect x="535" y="145" width="250" height="125" rx="20" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2" filter="url(#shadow)"/><text x="767" y="179" text-anchor="end" class="head">مرحلهٔ ۲</text><text x="767" y="213" text-anchor="end" class="body">ظرفیت C₂</text><rect x="150" y="145" width="250" height="125" rx="20" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2" filter="url(#shadow)"/><text x="382" y="179" text-anchor="end" class="head">مرحلهٔ ۳</text><text x="382" y="213" text-anchor="end" class="body">ظرفیت C₃</text><path d="M895 207 L780 207" stroke="#8290A3" stroke-width="3" marker-end="url(#arrow)"/><path d="M510 207 L395 207" stroke="#8290A3" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="310" width="1020" height="92" rx="22" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2"/><text x="1125" y="350" text-anchor="end" class="head">نرخ خروجی نظری سیستم</text><text x="1125" y="382" text-anchor="end" class="body">min(C₁, C₂, C₃)؛ کمترین ظرفیت، گلوگاه فعلی است.</text><rect x="150" y="430" width="1020" height="100" rx="22" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><text x="1125" y="470" text-anchor="end" class="head">مثال یک ایستگاه</text><text x="1125" y="505" text-anchor="end" class="body">۴۲۰ دقیقهٔ مفید ÷ ۲ دقیقه برای هر واحد = ۲۱۰ واحد ظرفیت نظری</text><text x="1240" y="566" text-anchor="end" class="small">توقف، تنوع کار، استراحت و بازده واقعی را بسنج؛ ظرفیت نظری تعهد خروجی نیست.</text></svg>