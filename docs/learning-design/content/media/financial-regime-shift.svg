<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">تغییر رژیم بازار و بازبینی مدل مالی</title><desc id="desc">نمودار مفهومی نشان می‌دهد مدل کالیبره‌شده در یک وضعیت بازار ممکن است پس از تغییر شرایط خطای بیشتری داشته باشد؛ پایش، تشخیص و بازنگری لازم است.</desc>
<rect width="1200" height="680" rx="30" fill="#fbf8f2"/><text x="600" y="62" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#27364b">وقتی شرایط بازار عوض می‌شود، رابطه‌های آموخته‌شده هم ممکن است عوض شوند</text>
<rect x="80" y="110" width="1040" height="425" rx="24" fill="#fff" stroke="#d9dfe5" stroke-width="2"/><line x1="175" y1="450" x2="1030" y2="450" stroke="#718096" stroke-width="3"/><line x1="175" y1="180" x2="175" y2="450" stroke="#718096" stroke-width="3"/><text x="600" y="500" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">زمان</text><text x="115" y="315" text-anchor="middle" transform="rotate(-90 115 315)" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">خطای پیش‌بینی</text>
<rect x="180" y="185" width="420" height="260" fill="#edf6f3" opacity=".9"/><rect x="600" y="185" width="420" height="260" fill="#fff0ec" opacity=".9"/><line x1="600" y1="178" x2="600" y2="450" stroke="#b77367" stroke-width="3" stroke-dasharray="10 8"/><text x="390" y="220" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#276b5d">وضعیت بازارِ مرجع</text><text x="810" y="220" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#9b4b44">شوک یا تغییر ساختاری</text>
<polyline points="205,365 260,342 315,355 370,320 425,340 480,310 540,330 585,320" fill="none" stroke="#6b8ec5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="615,325 670,350 725,295 780,380 835,300 890,395 945,305 1000,365" fill="none" stroke="#d57f6f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="570" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">مفهومی، بدون دادهٔ تجربی: این شکل فقط منطق پایش را نشان می‌دهد.</text>
<rect x="255" y="585" width="690" height="58" rx="16" fill="#e7e1f5"/><text x="600" y="622" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#514676">پایش خطا → تشخیص علت → محدودسازی/بازکالیبراسیون → ارزیابی دوباره</text></svg>