<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">تاب‌آوری در برابر هزینه و اثر</title><desc id="d">گزینه‌های ذخیره، تنوع و انعطاف را با هزینهٔ عادی و زیان اختلال مقایسه کن. تنوع منابع: تاب‌آوری را بالا می‌برد اما کیفیت، هماهنگی و قیمت را هم تغییر می‌دهد.؛ ذخیرهٔ ایمنی: زمان محافظت می‌خرد؛ هزینهٔ نگهداری، فساد یا منسوخ‌شدن را اضافه کن.؛ انعطاف ظرفیت: قرارداد یا مسیر جایگزین می‌سازد؛ دسترس‌پذیری در بحران را راستی‌آزمایی کن.؛ پایداری و عدالت: هزینهٔ زیست‌محیطی و اثر بر تأمین‌کننده و کارگر را کنار سرعت و قیمت ببین.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">تاب‌آوری در برابر هزینه و اثر</text><text x="1150" y="86" text-anchor="end" class="sub">گزینه‌های ذخیره، تنوع و انعطاف را با هزینهٔ عادی و زیان اختلال مقایسه کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">تنوع منابع</text><text x="1116" y="240" text-anchor="end" class="b">تاب‌آوری را بالا می‌برد</text><text x="1116" y="270" text-anchor="end" class="b">اما کیفیت، هماهنگی و</text><text x="1116" y="300" text-anchor="end" class="b">قیمت را هم تغییر</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">ذخیرهٔ ایمنی</text><text x="556" y="240" text-anchor="end" class="b">زمان محافظت می‌خرد؛</text><text x="556" y="270" text-anchor="end" class="b">هزینهٔ نگهداری، فساد</text><text x="556" y="300" text-anchor="end" class="b">یا منسوخ‌شدن را اضافه</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">انعطاف ظرفیت</text><text x="1116" y="470" text-anchor="end" class="b">قرارداد یا مسیر جایگزین</text><text x="1116" y="500" text-anchor="end" class="b">می‌سازد؛ دسترس‌پذیری</text><text x="1116" y="530" text-anchor="end" class="b">در بحران را راستی‌آزمایی</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">پایداری و عدالت</text><text x="556" y="470" text-anchor="end" class="b">هزینهٔ زیست‌محیطی و</text><text x="556" y="500" text-anchor="end" class="b">اثر بر تأمین‌کننده و</text><text x="556" y="530" text-anchor="end" class="b">کارگر را کنار سرعت و</text></g><text x="1150" y="674" text-anchor="end" class="foot">گزینهٔ بهینه به سناریو و اولویت خدمت بستگی دارد؛ یک امتیاز کل ممکن است مبادله را پنهان کند.</text></svg>
