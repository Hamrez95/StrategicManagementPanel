<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">سه صورت مالی سپهر چگونه به هم وصل می‌شوند</title><desc id="desc">درآمد دویست منهای هزینه صد و پنجاه برابر سود پنجاه است. فروش نسیه می‌تواند طلب را بالا ببرد بی‌آنکه نقد همان لحظه دریافت شود. صورت جریان نقد تغییر وجه و صورت وضعیت مالی ماندهٔ طلب و نقد را نشان می‌دهد.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="680" rx="28" fill="#fbfaf7"/><text x="600" y="56" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#19324a">سه صورت مالی، سه زاویهٔ یک کسب‌وکار</text>
<rect x="55" y="110" width="320" height="220" rx="22" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="215" y="154" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#245744">سود و زیان | طی دوره</text><text x="215" y="205" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#19324a">درآمد ۲۰۰</text><text x="215" y="244" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#19324a">− هزینهٔ ۱۵۰</text><path d="M105 263H325" stroke="#83bda4" stroke-width="2"/><text x="215" y="305" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#245744">سود ۵۰</text>
<rect x="825" y="110" width="320" height="220" rx="22" fill="#eaf0fa" stroke="#91a8d1" stroke-width="3"/><text x="985" y="154" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#344f7d">وضعیت مالی | یک تاریخ</text><text x="985" y="216" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#19324a">دارایی‌ها، بدهی‌ها</text><text x="985" y="254" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#19324a">و حقوق مالکانه</text><text x="985" y="302" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52657e">طلب و ماندهٔ نقد در اینجا دیده می‌شوند</text>
<rect x="440" y="390" width="320" height="190" rx="22" fill="#fff0df" stroke="#e4b77a" stroke-width="3"/><text x="600" y="435" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#80551d">جریان نقد | طی دوره</text><text x="600" y="485" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#19324a">دریافت و پرداخت وجه</text><text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52657e">فروش نسیه فوراً وجه نمی‌آورد</text>
<path d="M375 222H805" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="590" y="204" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52657e">سود به حقوق مالکانه وصل می‌شود؛ جزئیات تغییرات را ببین</text><path d="M325 330Q370 420 440 450" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M760 470Q820 430 875 330" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="600" y="630" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52657e">سود ۵۰، الزاماً به معنی افزایش ۵۰ واحدی وجه نقد نیست؛ دوره، تاریخ و اقلام تعهدی را تطبیق بده.</text></svg>
