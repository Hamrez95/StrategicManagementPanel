<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" role="img" aria-labelledby="title desc"><title id="title">ماتریس رشد آنسوف</title><desc id="desc">ماتریس دوبعدی بازار فعلی یا جدید در برابر محصول فعلی یا جدید، با چهار مسیر رشد.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.t{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#68768A}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1080" y="48" text-anchor="end" class="t">ماتریس رشد آنسوف؛ بازار و محصول را کنار هم بخوان</text><text x="1080" y="82" text-anchor="end" class="s">طبقه‌بندی مسیر است؛ به‌تنهایی احتمال موفقیت را پیش‌بینی نمی‌کند.</text><text x="540" y="128" text-anchor="middle" class="s">بازار فعلی ← بازار جدید</text><text x="35" y="340" text-anchor="middle" class="s" transform="rotate(-90 35 340)">محصول فعلی ↑ محصول جدید</text><rect x="560" y="150" width="470" height="150" rx="18" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2" filter="url(#s)"/><text x="1014" y="180" text-anchor="end" class="h">نفوذ در بازار</text><text x="1014" y="210" text-anchor="end" class="b" style="font-size:15px">همان خدمت به همان بخش</text><rect x="70" y="150" width="470" height="150" rx="18" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2" filter="url(#s)"/><text x="524" y="180" text-anchor="end" class="h">توسعهٔ بازار</text><text x="524" y="210" text-anchor="end" class="b" style="font-size:15px">همان خدمت برای بخش تازه</text><rect x="560" y="330" width="470" height="150" rx="18" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2" filter="url(#s)"/><text x="1014" y="360" text-anchor="end" class="h">توسعهٔ محصول</text><text x="1014" y="390" text-anchor="end" class="b" style="font-size:15px">خدمت تازه برای مشتری فعلی</text><rect x="70" y="330" width="470" height="150" rx="18" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2" filter="url(#s)"/><text x="524" y="360" text-anchor="end" class="h">تنوع‌سازی</text><text x="524" y="390" text-anchor="end" class="b" style="font-size:15px">محصول تازه در بازار تازه</text><text x="1080" y="535" text-anchor="end" class="s">برای هر مسیر، توان، سرمایه، کانال و فرض پرریسک را جداگانه بنویس.</text></svg>