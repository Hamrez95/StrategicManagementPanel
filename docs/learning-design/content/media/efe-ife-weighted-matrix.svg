<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc"><title id="title">نمونهٔ ماتریس‌های EFE و IFE</title><desc id="desc">دو جدول نمونهٔ EFE و IFE با وزن و امتیازهای وزنی که در متن درس آمده است. مجموع وزن هر ماتریس یک و مجموع امتیاز وزنی هر دو ۲٫۵۵ است.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.t{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#68768A}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1360" y="48" text-anchor="end" class="t">از وزن تا امتیاز؛ نمونهٔ EFE و IFE</text><text x="1360" y="82" text-anchor="end" class="s">وزن × امتیاز = امتیاز وزنی؛ مجموع وزن‌ها باید ۱ باشد.</text><rect x="710" y="115" width="610" height="410" rx="22" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><text x="1290" y="155" text-anchor="end" class="h">EFE؛ پاسخ به عوامل بیرونی</text><text x="1290" y="196" text-anchor="end" class="s">عامل</text><text x="1045" y="196" text-anchor="end" class="s">محاسبه</text><text x="780" y="196" text-anchor="end" class="s">وزنی</text><rect x="730" y="210" width="570" height="42" rx="10" fill="#F4F7FB"/><text x="1290" y="236" text-anchor="end" class="b">تقاضای پاسخ سریع</text><text x="1045" y="236" text-anchor="end" class="b">۰٫۳۰ × ۳</text><text x="780" y="236" text-anchor="end" class="b">۰٫۹۰</text><text x="1290" y="290" text-anchor="end" class="b">دسترسی AI</text><text x="1045" y="290" text-anchor="end" class="b">۰٫۲۰ × ۲</text><text x="780" y="290" text-anchor="end" class="b">۰٫۴۰</text><rect x="730" y="318" width="570" height="42" rx="10" fill="#F4F7FB"/><text x="1290" y="344" text-anchor="end" class="b">رقیب کم‌هزینه</text><text x="1045" y="344" text-anchor="end" class="b">۰٫۲۵ × ۲</text><text x="780" y="344" text-anchor="end" class="b">۰٫۵۰</text><text x="1290" y="398" text-anchor="end" class="b">حریم خصوصی</text><text x="1045" y="398" text-anchor="end" class="b">۰٫۲۵ × ۳</text><text x="780" y="398" text-anchor="end" class="b">۰٫۷۵</text><rect x="730" y="455" width="570" height="48" rx="13" fill="#E8F5ED"/><text x="1270" y="486" text-anchor="end" class="h">مجموع وزنی: ۲٫۵۵</text><rect x="50" y="115" width="610" height="410" rx="22" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><text x="630" y="155" text-anchor="end" class="h">IFE؛ توان و ضعف درونی</text><text x="630" y="196" text-anchor="end" class="s">عامل</text><text x="385" y="196" text-anchor="end" class="s">محاسبه</text><text x="120" y="196" text-anchor="end" class="s">وزنی</text><rect x="70" y="210" width="570" height="42" rx="10" fill="#F4F7FB"/><text x="630" y="236" text-anchor="end" class="b">دانش رسیدگی</text><text x="385" y="236" text-anchor="end" class="b">۰٫۳۰ × ۴</text><text x="120" y="236" text-anchor="end" class="b">۱٫۲۰</text><text x="630" y="290" text-anchor="end" class="b">دادهٔ پراکنده</text><text x="385" y="290" text-anchor="end" class="b">۰٫۲۵ × ۱</text><text x="120" y="290" text-anchor="end" class="b">۰٫۲۵</text><rect x="70" y="318" width="570" height="42" rx="10" fill="#F4F7FB"/><text x="630" y="344" text-anchor="end" class="b">اختیار تیم</text><text x="385" y="344" text-anchor="end" class="b">۰٫۲۰ × ۳</text><text x="120" y="344" text-anchor="end" class="b">۰٫۶۰</text><text x="630" y="398" text-anchor="end" class="b">وابستگی فروشنده</text><text x="385" y="398" text-anchor="end" class="b">۰٫۲۵ × ۲</text><text x="120" y="398" text-anchor="end" class="b">۰٫۵۰</text><rect x="70" y="455" width="570" height="48" rx="13" fill="#E8F5ED"/><text x="610" y="486" text-anchor="end" class="h">مجموع وزنی: ۲٫۵۵</text><text x="1360" y="574" text-anchor="end" class="s">نمونه‌ها فرضی‌اند؛ نمرهٔ EFE پاسخ سازمان را می‌سنجد، نه خوب یا بد بودن فرصت یا تهدید.</text></svg>