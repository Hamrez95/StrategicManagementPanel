<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc"><title id="title">ترجمهٔ راهبرد کسب‌وکار به قابلیت انسانی</title><desc id="desc">هدف کسب‌وکار به انتخاب رقابتی و ارزش پیشنهادی وصل می‌شود؛ سپس قابلیت کلیدی، کارهای لازم، مهارت و ظرفیت، نقش‌ها و سیستم‌های پشتیبان طراحی می‌شوند. هر پیوند فرضی مدیریتی است و باید با شاهد یا آزمون سنجیده شود.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1300" height="560" rx="28" fill="#fbfaf7"/><text x="650" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#19324a">از انتخاب رقابتی تا طراحی کار و مهارت</text><g font-family="sans-serif" text-anchor="middle"><rect x="40" y="180" width="175" height="150" rx="18" fill="#eaf0fa" stroke="#91a8d1" stroke-width="3"/><text x="127" y="225" font-size="20" font-weight="700" fill="#344f7d">هدف و اولویت</text><text x="127" y="265" font-size="17" fill="#19324a">مثلاً تحویل</text><text x="127" y="292" font-size="17" fill="#19324a">سریع و قابل‌اعتماد</text><rect x="255" y="180" width="175" height="150" rx="18" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="342" y="225" font-size="20" font-weight="700" fill="#245744">ارزش پیشنهادی</text><text x="342" y="268" font-size="17" fill="#19324a">برای کدام مشتری</text><text x="342" y="295" font-size="17" fill="#19324a">و کدام نیاز؟</text><rect x="470" y="180" width="175" height="150" rx="18" fill="#fff0df" stroke="#e4b77a" stroke-width="3"/><text x="557" y="225" font-size="20" font-weight="700" fill="#80551d">قابلیت کلیدی</text><text x="557" y="268" font-size="17" fill="#19324a">توان تکرارپذیر</text><text x="557" y="295" font-size="17" fill="#19324a">سازمان</text><rect x="685" y="180" width="175" height="150" rx="18" fill="#f0edf8" stroke="#a89acb" stroke-width="3"/><text x="772" y="225" font-size="20" font-weight="700" fill="#58477c">کارهای لازم</text><text x="772" y="268" font-size="17" fill="#19324a">فعالیت و هماهنگی</text><text x="772" y="295" font-size="17" fill="#19324a">روزانه</text><rect x="900" y="180" width="175" height="150" rx="18" fill="#f8e9ef" stroke="#d49bb1" stroke-width="3"/><text x="987" y="225" font-size="20" font-weight="700" fill="#7a4059">مهارت و ظرفیت</text><text x="987" y="268" font-size="17" fill="#19324a">دانش، ابزار</text><text x="987" y="295" font-size="17" fill="#19324a">و زمان</text><rect x="1115" y="180" width="155" height="150" rx="18" fill="#eaf0fa" stroke="#91a8d1" stroke-width="3"/><text x="1192" y="225" font-size="20" font-weight="700" fill="#344f7d">طراحی نقش</text><text x="1192" y="268" font-size="16" fill="#19324a">اختیار، فرایند</text><text x="1192" y="295" font-size="16" fill="#19324a">و پاداش</text></g><path d="M215 255H245M430 255H460M645 255H675M860 255H890M1075 255H1105" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="190" y="390" width="920" height="95" rx="20" fill="#fff7e8" stroke="#dfbd7c" stroke-width="2"/><text x="650" y="430" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#80551d">هر پیکان یک فرض است؛ با شاهد مشتری، دادهٔ عملکرد یا آزمون سازمانی بررسی‌اش کن.</text><text x="650" y="465" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52657e">فقط عوض‌کردن عنوان شغلی، قابلیت سازمانی نمی‌سازد؛ دانش، ابزار، فرایند، هماهنگی، اختیار و پاداش باید هم‌راستا شوند.</text></svg>
