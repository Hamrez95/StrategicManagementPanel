<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">مقایسهٔ NPV و IRR</title><desc id="desc">مقایسهٔ ارزش فعلی خالص و نرخ بازده داخلی برای دو پروژهٔ فرضی یک‌ساله با نرخ لازم ده درصد.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#68768A}.number{font-size:23px;font-weight:700}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1240" y="48" text-anchor="end" class="title">NPV مقدار ارزش است؛ IRR نرخ درصدی</text><text x="1240" y="83" text-anchor="end" class="small">دو پروژهٔ یک‌ساله و متقابلاً مانع؛ نرخ لازم ۱۰٪</text><rect x="655" y="112" width="570" height="115" rx="20" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2" filter="url(#shadow)"/><text x="1207" y="146" text-anchor="end" class="head">فرمول ارزش فعلی خالص</text><text x="1207" y="180" text-anchor="end" class="body">NPV = − سرمایه‌گذاری امروز + جریان آینده ÷ (۱ + نرخ)</text><rect x="55" y="112" width="570" height="115" rx="20" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2" filter="url(#shadow)"/><text x="607" y="146" text-anchor="end" class="head">پرسش تصمیم</text><text x="607" y="180" text-anchor="end" class="body">کدام گزینه ارزش پولی بیشتری اضافه می‌کند؟</text><text x="1230" y="274" text-anchor="end" class="head">NPV در نرخ ۱۰٪</text><text x="1230" y="312" text-anchor="end" class="body">پروژهٔ الف</text><rect x="260" y="291" width="176" height="28" rx="14" fill="#AFC8F6"/><text x="240" y="312" text-anchor="end" class="body">۲۷٫۲۷</text><text x="1230" y="360" text-anchor="end" class="body">پروژهٔ ب</text><rect x="260" y="339" width="470" height="28" rx="14" fill="#9FD6B4"/><text x="240" y="360" text-anchor="end" class="body">۱۳۶٫۳۶</text><text x="1230" y="426" text-anchor="end" class="head">IRR؛ با مقیاس درصدی جداگانه</text><text x="1230" y="464" text-anchor="end" class="body">پروژهٔ الف</text><rect x="260" y="443" width="470" height="28" rx="14" fill="#D4C4F1"/><text x="240" y="464" text-anchor="end" class="body">۴۰٪</text><text x="1230" y="512" text-anchor="end" class="body">پروژهٔ ب</text><rect x="260" y="491" width="294" height="28" rx="14" fill="#F3D4A9"/><text x="240" y="512" text-anchor="end" class="body">۲۵٪</text><text x="1230" y="566" text-anchor="end" class="small">در این مثال الف درصد بالاتر دارد؛ ب ارزش پولی بیشتری می‌افزاید. مقیاس هر نمودار مستقل است.</text></svg>