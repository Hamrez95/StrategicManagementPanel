<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">طیف اختیار انسان و ابزار</title><desc id="d">چهار سطح از اطلاعات و پیش‌نویس تا اقدام برگشت‌ناپذیر را در برابر شدت کنترل و نیاز به تأیید انسانی نشان می‌دهد.</desc><rect width="1200" height="720" rx="30" fill="#fbf8f2"/><text x="600" y="60" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#27364b">اختیار ابزار را با پیامد خطا متناسب کنید</text><text x="600" y="98" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#667386">سطح خودکارسازی بیشتر، نیازمند مهار و پاسخ‌گویی روشن‌تر است</text>
<line x1="145" y1="610" x2="1055" y2="610" stroke="#9aa6b2" stroke-width="4"/><path d="M1055 610 l-18 -12 v24 z" fill="#9aa6b2"/><text x="600" y="666" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#556274">افزایش اختیار و اثر بیرونی اقدام</text>
<g font-family="Tahoma,Arial,sans-serif"><rect x="90" y="180" width="240" height="350" rx="24" fill="#e5f1f7"/><circle cx="210" cy="220" r="27" fill="#8dbbd0"/><text x="210" y="281" text-anchor="middle" font-size="23" font-weight="700" fill="#3e6480">۱. نمایش اطلاعات</text><text x="210" y="330" text-anchor="middle" font-size="18" fill="#27364b">ابزار جست‌وجو یا</text><text x="210" y="358" text-anchor="middle" font-size="18" fill="#27364b">خلاصه می‌کند</text><rect x="112" y="404" width="196" height="88" rx="16" fill="#fff"/><text x="210" y="440" text-anchor="middle" font-size="17" fill="#3e6480">کنترل پایه:</text><text x="210" y="470" text-anchor="middle" font-size="16" fill="#556274">منبع و دسترسی</text>
<rect x="370" y="180" width="240" height="350" rx="24" fill="#e7f2eb"/><circle cx="490" cy="220" r="27" fill="#9bc7a8"/><text x="490" y="281" text-anchor="middle" font-size="23" font-weight="700" fill="#3d7653">۲. پیشنهاد</text><text x="490" y="330" text-anchor="middle" font-size="18" fill="#27364b">انسان بررسی و</text><text x="490" y="358" text-anchor="middle" font-size="18" fill="#27364b">تصمیم می‌گیرد</text><rect x="392" y="404" width="196" height="88" rx="16" fill="#fff"/><text x="490" y="440" text-anchor="middle" font-size="17" fill="#3d7653">کنترل پایه:</text><text x="490" y="470" text-anchor="middle" font-size="16" fill="#556274">شاهد و بازبینی</text>
<rect x="650" y="180" width="240" height="350" rx="24" fill="#fff0e7"/><circle cx="770" cy="220" r="27" fill="#e4b18b"/><text x="770" y="281" text-anchor="middle" font-size="23" font-weight="700" fill="#a76439">۳. اقدام محدود</text><text x="770" y="330" text-anchor="middle" font-size="18" fill="#27364b">ابزار اجرا می‌کند</text><text x="770" y="358" text-anchor="middle" font-size="18" fill="#27364b">در دامنهٔ مشخص</text><rect x="672" y="404" width="196" height="88" rx="16" fill="#fff"/><text x="770" y="440" text-anchor="middle" font-size="17" fill="#a76439">کنترل پایه:</text><text x="770" y="470" text-anchor="middle" font-size="16" fill="#556274">سقف، ثبت، توقف</text>
<rect x="930" y="180" width="240" height="350" rx="24" fill="#f6dcd5"/><circle cx="1050" cy="220" r="27" fill="#d99b8d"/><text x="1050" y="281" text-anchor="middle" font-size="23" font-weight="700" fill="#9b4b44">۴. تصمیم پراثر</text><text x="1050" y="330" text-anchor="middle" font-size="18" fill="#27364b">نتیجه بیرونی یا</text><text x="1050" y="358" text-anchor="middle" font-size="18" fill="#27364b">سخت‌بازگشت است</text><rect x="952" y="404" width="196" height="88" rx="16" fill="#fff"/><text x="1050" y="440" text-anchor="middle" font-size="17" fill="#9b4b44">کنترل پایه:</text><text x="1050" y="470" text-anchor="middle" font-size="16" fill="#556274">تأیید صریح انسان</text></g><text x="600" y="700" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="15" fill="#667386">نردبان مفهومی است؛ حد اختیار باید با زمینه، قانون و پیامد کاربرد تعیین شود.</text></svg>