<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">ماتریس IE</title><desc id="desc">شبکهٔ سه‌درسه از قوت IFE روی محور افقی و قوت EFE روی محور عمودی؛ گزینه‌های رشد، حفظ و برداشت به عنوان گزینهٔ بررسی نمایش داده شده‌اند.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.t{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#68768A}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1050" y="48" text-anchor="end" class="t">ماتریس IE؛ دو تشخیص را برای ساخت گزینه کنار هم بگذار</text><text x="1050" y="82" text-anchor="end" class="s">محور افقی: IFE؛ محور عمودی: EFE. خانهٔ میانی مثال سپهر: ۲٫۵۵ و ۲٫۵۵.</text><rect x="300" y="145" width="235" height="115" rx="16" fill="#E8F5ED" stroke="#FFFFFF" stroke-width="3"/><text x="417.5" y="200" text-anchor="middle" class="h">رشد / ساخت</text><rect x="541" y="145" width="235" height="115" rx="16" fill="#E8F5ED" stroke="#FFFFFF" stroke-width="3"/><text x="658.5" y="200" text-anchor="middle" class="h">رشد / ساخت</text><rect x="782" y="145" width="235" height="115" rx="16" fill="#E8F5ED" stroke="#FFFFFF" stroke-width="3"/><text x="899.5" y="200" text-anchor="middle" class="h">رشد / ساخت</text><rect x="300" y="266" width="235" height="115" rx="16" fill="#FFF2E3" stroke="#FFFFFF" stroke-width="3"/><text x="417.5" y="321" text-anchor="middle" class="h">حفظ / بهبود</text><rect x="541" y="266" width="235" height="115" rx="16" fill="#FFF2E3" stroke="#FFFFFF" stroke-width="3"/><text x="658.5" y="321" text-anchor="middle" class="h">حفظ / بهبود</text><rect x="782" y="266" width="235" height="115" rx="16" fill="#E8F5ED" stroke="#FFFFFF" stroke-width="3"/><text x="899.5" y="321" text-anchor="middle" class="h">رشد انتخابی</text><rect x="300" y="387" width="235" height="115" rx="16" fill="#FCEAF0" stroke="#FFFFFF" stroke-width="3"/><text x="417.5" y="442" text-anchor="middle" class="h">برداشت / کاهش</text><rect x="541" y="387" width="235" height="115" rx="16" fill="#FCEAF0" stroke="#FFFFFF" stroke-width="3"/><text x="658.5" y="442" text-anchor="middle" class="h">برداشت / کاهش</text><rect x="782" y="387" width="235" height="115" rx="16" fill="#FFF2E3" stroke="#FFFFFF" stroke-width="3"/><text x="899.5" y="442" text-anchor="middle" class="h">حفظ انتخابی</text><text x="620" y="525" text-anchor="middle" class="s">IFE: ضعیف ← متوسط ← قوی</text><text x="180" y="320" text-anchor="middle" class="s" transform="rotate(-90 180 320)">EFE: ضعیف ← متوسط ← قوی</text><circle cx="653" cy="323" r="13" fill="#506FAE" stroke="#FFFFFF" stroke-width="4"/><text x="680" y="328" class="s">سپهر؛ نقطهٔ نمونه در خانهٔ مرکزی</text><text x="1050" y="574" text-anchor="end" class="s">جهت گزینه را بررسی کن؛ ماتریس به‌تنهایی دستور سرمایه‌گذاری یا توقف نیست.</text></svg>