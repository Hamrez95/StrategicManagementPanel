<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">قرارداد ناقص، اختیار و خروج</title><desc id="d">وقتی آینده را نمی‌توان کامل نوشت، حق تصمیم و سازوکار سازگاری اهمیت پیدا می‌کند. تعهدهای قابل‌مشاهده: آنچه می‌توان سنجید و راستی‌آزمایی کرد را صریح تعریف کن؛ شاخص مبهم اختلاف می‌سازد.؛ انگیزه و اطلاعات: مشوق باید رفتار مطلوب را تقویت کند و فرصت پنهان‌کاری یا انتقال هزینه را محدود سازد.؛ اختیار باقیمانده: برای رویداد پیش‌بینی‌نشده مشخص کن چه کسی تصمیم می‌گیرد و با چه محدودیتی.؛ تغییر یا خروج: بازنگری، حل اختلاف و پایان همکاری را از پیش طراحی کن؛ خروج هم هزینه و تعهد دارد.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">قرارداد ناقص، اختیار و خروج</text><text x="1150" y="86" text-anchor="end" class="sub">وقتی آینده را نمی‌توان کامل نوشت، حق تصمیم و سازوکار سازگاری اهمیت پیدا می‌کند.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">تعهدهای قابل‌مشاهده</text><text x="1116" y="240" text-anchor="end" class="b">آنچه می‌توان سنجید و</text><text x="1116" y="270" text-anchor="end" class="b">راستی‌آزمایی کرد را</text><text x="1116" y="300" text-anchor="end" class="b">صریح تعریف کن؛ شاخص</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">انگیزه و اطلاعات</text><text x="556" y="240" text-anchor="end" class="b">مشوق باید رفتار مطلوب</text><text x="556" y="270" text-anchor="end" class="b">را تقویت کند و فرصت</text><text x="556" y="300" text-anchor="end" class="b">پنهان‌کاری یا انتقال</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">اختیار باقیمانده</text><text x="1116" y="470" text-anchor="end" class="b">برای رویداد پیش‌بینی‌نشده</text><text x="1116" y="500" text-anchor="end" class="b">مشخص کن چه کسی تصمیم</text><text x="1116" y="530" text-anchor="end" class="b">می‌گیرد و با چه</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">تغییر یا خروج</text><text x="556" y="470" text-anchor="end" class="b">بازنگری، حل اختلاف و</text><text x="556" y="500" text-anchor="end" class="b">پایان همکاری را از</text><text x="556" y="530" text-anchor="end" class="b">پیش طراحی کن؛ خروج هم</text></g><text x="1150" y="674" text-anchor="end" class="foot">این نقشه چارچوب مفهومی است؛ تنظیم قرارداد واقعی نیازمند بررسی حقوقی متناسب با حوزهٔ قضایی است.</text></svg>
