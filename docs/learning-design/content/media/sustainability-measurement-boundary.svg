<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">مرز سنجش اثر زیست‌محیطی</title><desc id="d">عدد انتشار بدون مرز، دوره، داده و روش محاسبه قابل مقایسه نیست. مرز سازمانی: واحد، مالکیت یا کنترل و دورهٔ گزارش را اعلام کن؛ تغییر مرز را توضیح بده.؛ دامنهٔ ۱ و ۲: انتشار مستقیم را از انرژی خریداری‌شده جدا ثبت کن؛ فعالیت و ضریب را مستند کن.؛ دامنهٔ ۳: زنجیرهٔ ارزش را بخش‌بندی کن؛ برآورد و دادهٔ اولیه را با سطح کیفیت نشان بده.؛ عدم‌قطعیت و اقدام: فرض، ضریب، پوشش و عدم‌قطعیت را گزارش کن؛ کاهش را با خط مبنای ثابت بسنج.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">مرز سنجش اثر زیست‌محیطی</text><text x="1150" y="86" text-anchor="end" class="sub">عدد انتشار بدون مرز، دوره، داده و روش محاسبه قابل مقایسه نیست.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">مرز سازمانی</text><text x="1116" y="240" text-anchor="end" class="b">واحد، مالکیت یا کنترل</text><text x="1116" y="270" text-anchor="end" class="b">و دورهٔ گزارش را اعلام</text><text x="1116" y="300" text-anchor="end" class="b">کن؛ تغییر مرز را توضیح</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">دامنهٔ ۱ و ۲</text><text x="556" y="240" text-anchor="end" class="b">انتشار مستقیم را از</text><text x="556" y="270" text-anchor="end" class="b">انرژی خریداری‌شده جدا</text><text x="556" y="300" text-anchor="end" class="b">ثبت کن؛ فعالیت و ضریب</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">دامنهٔ ۳</text><text x="1116" y="470" text-anchor="end" class="b">زنجیرهٔ ارزش را بخش‌بندی</text><text x="1116" y="500" text-anchor="end" class="b">کن؛ برآورد و دادهٔ</text><text x="1116" y="530" text-anchor="end" class="b">اولیه را با سطح کیفیت</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">عدم‌قطعیت و اقدام</text><text x="556" y="470" text-anchor="end" class="b">فرض، ضریب، پوشش و</text><text x="556" y="500" text-anchor="end" class="b">عدم‌قطعیت را گزارش</text><text x="556" y="530" text-anchor="end" class="b">کن؛ کاهش را با خط</text></g><text x="1150" y="674" text-anchor="end" class="foot">استاندارد و قواعد گزارش‌دهی با زمینه فرق دارند؛ ادعاهای زیست‌محیطی را بدون راستی‌آزمایی قطعی نکن.</text></svg>
