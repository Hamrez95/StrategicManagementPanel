<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">نقطهٔ سفارش مجدد و ذخیرهٔ اطمینان</title><desc id="desc">تقاضای متوسط روزانه ۲۰ واحد در پنج روز زمان تأمین، صد واحد است. با ذخیرهٔ اطمینان ۳۰ واحد، نقطهٔ سفارش مجدد ۱۳۰ واحد می‌شود. زمان تأمین گاهی از ۵ به ۸ روز می‌رسد؛ میانگین به‌تنهایی ریسک را نشان نمی‌دهد.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="610" rx="28" fill="#fbfaf7"/><text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#19324a">نقطهٔ سفارش مجدد (ROP) و ذخیرهٔ اطمینان</text>
<text x="120" y="130" font-family="sans-serif" font-size="20" fill="#52657e">موقعیت موجودی</text><path d="M150 160V465H1090" fill="none" stroke="#64748b" stroke-width="3"/><path d="M185 190L300 220L440 260L580 300L720 345L855 395L1010 445" fill="none" stroke="#6689bc" stroke-width="6"/><line x1="150" y1="300" x2="1080" y2="300" stroke="#d18a51" stroke-width="4" stroke-dasharray="12 9"/><text x="1070" y="285" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="700" fill="#9a5d28">ROP = ۱۳۰ واحد ← سفارش بده</text><line x1="150" y1="380" x2="1080" y2="380" stroke="#83bda4" stroke-width="3" stroke-dasharray="8 8"/><text x="1070" y="367" text-anchor="end" font-family="sans-serif" font-size="18" fill="#245744">ذخیرهٔ اطمینان = ۳۰</text><text x="200" y="505" font-family="sans-serif" font-size="18" fill="#52657e">موجودی در دست + سفارش در راه − تعهدات</text><rect x="130" y="525" width="940" height="57" rx="15" fill="#fff0df"/><text x="600" y="562" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#80551d">۲۰ واحد در روز × ۵ روز تأمین = ۱۰۰؛ ۱۰۰ + ۳۰ ذخیره = نقطهٔ سفارش ۱۳۰</text><text x="600" y="115" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#7a4059">مثال ساده: تأمین گاهی ۸ روز طول می‌کشد؛ پراکندگی تقاضا و زمان تأمین را هم در سطح خدمت ببین.</text></svg>
