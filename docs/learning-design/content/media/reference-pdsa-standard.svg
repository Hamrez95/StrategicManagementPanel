<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img"><title>Plan–Do–Study–Act (PDSA)</title><desc>The lesson uses Study, not Check. Preserve the distinction from PDCA.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#333"/></marker></defs><rect width="1100" height="720" fill="white"/><g font-family="Arial, sans-serif" fill="#171717"><text x="550" y="54" font-size="32" text-anchor="middle">Plan–Do–Study–Act (PDSA)</text><rect x="370" y="110" width="360" height="100" fill="#fff" stroke="#222" stroke-width="2"/><text x="550" y="160" font-size="23" text-anchor="middle">Plan</text><rect x="730" y="300" width="300" height="100" fill="#fff" stroke="#222" stroke-width="2"/><text x="880" y="350" font-size="23" text-anchor="middle">Do</text><rect x="370" y="490" width="360" height="100" fill="#fff" stroke="#222" stroke-width="2"/><text x="550" y="540" font-size="23" text-anchor="middle">Study</text><rect x="60" y="300" width="300" height="100" fill="#fff" stroke="#222" stroke-width="2"/><text x="210" y="350" font-size="23" text-anchor="middle">Act</text><path d="M730 160L875 295" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M875 400L735 530" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 535L215 405" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M215 300L365 165" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="345" font-size="26" text-anchor="middle">Test and learn</text><text x="550" y="383" font-size="22" text-anchor="middle">Repeat in context</text><text x="550" y="678" font-size="17" text-anchor="middle">The lesson uses Study, not Check. Preserve the distinction from PDCA.</text><text x="550" y="705" font-size="14" text-anchor="middle">Independent educational drawing by Stratino. Not publisher artwork. CC BY 4.0.</text></g></svg>
