<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">ارزش داده، اثر شبکه و مدل کسب‌وکار</title><desc id="d">رابطهٔ گروه‌های بازار، تصمیم‌های داده و منطق درآمد/هزینه را به هم وصل کن. ارزش داده: داده فقط وقتی ارزش دارد که تصمیم را بهتر کند؛ کیفیت، دسترسی و هزینهٔ نگهداری را بسنج.؛ دو سوی پلتفرم: گروه‌های متعامل و مسئلهٔ هر سمت را تعریف کن؛ کاربر و پرداخت‌کننده یکی نیستند.؛ شبکه و قیمت: اثر حضور یک گروه بر گروه دیگر را بررسی کن؛ یارانه و اعتماد را هم وارد تصمیم کن.؛ بوم مدل: بخش مشتری، ارزش، کانال، درآمد و هزینه باید با منطق خدمت سازگار باشند.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">ارزش داده، اثر شبکه و مدل کسب‌وکار</text><text x="1150" y="86" text-anchor="end" class="sub">رابطهٔ گروه‌های بازار، تصمیم‌های داده و منطق درآمد/هزینه را به هم وصل کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#fff" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">ارزش داده</text><text x="1116" y="240" text-anchor="end" class="b">داده فقط وقتی ارزش</text><text x="1116" y="270" text-anchor="end" class="b">دارد که تصمیم را بهتر</text><text x="1116" y="300" text-anchor="end" class="b">کند؛ کیفیت، دسترسی و</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#fff" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">دو سوی پلتفرم</text><text x="556" y="240" text-anchor="end" class="b">گروه‌های متعامل و</text><text x="556" y="270" text-anchor="end" class="b">مسئلهٔ هر سمت را تعریف</text><text x="556" y="300" text-anchor="end" class="b">کن؛ کاربر و پرداخت‌کننده</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#fff" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">شبکه و قیمت</text><text x="1116" y="470" text-anchor="end" class="b">اثر حضور یک گروه بر</text><text x="1116" y="500" text-anchor="end" class="b">گروه دیگر را بررسی</text><text x="1116" y="530" text-anchor="end" class="b">کن؛ یارانه و اعتماد</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#fff" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">بوم مدل</text><text x="556" y="470" text-anchor="end" class="b">بخش مشتری، ارزش، کانال،</text><text x="556" y="500" text-anchor="end" class="b">درآمد و هزینه باید با</text><text x="556" y="530" text-anchor="end" class="b">منطق خدمت سازگار باشند.</text></g><text x="1150" y="674" text-anchor="end" class="foot">مثال‌ها و معیارها را با دادهٔ زمینهٔ واقعی و فرض‌های آشکار ارزیابی کن.</text></svg>
