<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc"><title id="title">حساسیت ماتریس انتخاب</title><desc id="desc">دو رتبه‌بندی با وزن‌های متفاوت نشان می‌دهد که گزینهٔ برنده در مثال فرضی از الف به ب تغییر می‌کند.</desc><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.t{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#68768A}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1360" y="48" text-anchor="end" class="t">ماتریس انتخاب؛ رتبه را زیر دو وزن مقایسه کن</text><text x="1360" y="82" text-anchor="end" class="s">نمونهٔ فرضی سپهر؛ نمره‌ها از متن همین درس.</text><rect x="710" y="120" width="610" height="330" rx="22" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><text x="1290" y="160" text-anchor="end" class="h">وزن پایه: کیفیت ۰٫۶، هزینه ۰٫۴</text><text x="1280" y="212" text-anchor="end" class="s">گزینه</text><text x="1070" y="212" text-anchor="end" class="s">الف</text><text x="880" y="212" text-anchor="end" class="s">ب</text><text x="1280" y="267" text-anchor="end" class="b">امتیاز وزنی</text><text x="1070" y="267" text-anchor="end" class="h">۳٫۸</text><text x="880" y="267" text-anchor="end" class="h">۳٫۴</text><rect x="745" y="315" width="540" height="85" rx="16" fill="#E8F5ED"/><text x="1255" y="367" text-anchor="end" class="h">الف جلو می‌افتد</text><rect x="50" y="120" width="610" height="330" rx="22" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><text x="630" y="160" text-anchor="end" class="h">حساسیت: کیفیت ۰٫۳، هزینه ۰٫۷</text><text x="620" y="212" text-anchor="end" class="s">گزینه</text><text x="410" y="212" text-anchor="end" class="s">الف</text><text x="220" y="212" text-anchor="end" class="s">ب</text><text x="620" y="267" text-anchor="end" class="b">امتیاز وزنی</text><text x="410" y="267" text-anchor="end" class="h">۲٫۹</text><text x="220" y="267" text-anchor="end" class="h">۳٫۷</text><rect x="85" y="315" width="540" height="85" rx="16" fill="#FFF2E3"/><text x="595" y="367" text-anchor="end" class="h">ب جلو می‌افتد</text><text x="1360" y="510" text-anchor="end" class="h">رتبه با تغییر وزن‌ها عوض شد</text><text x="1360" y="552" text-anchor="end" class="s">حساسیت نتیجه یعنی وزن‌ها فرض تصمیم‌اند؛ معیارها و شاهدها را پیش از دیدن برنده تعریف کن.</text></svg>