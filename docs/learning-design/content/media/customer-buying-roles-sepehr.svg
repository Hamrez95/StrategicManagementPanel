<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">نقش‌های خرید خدمت یادگیری سپهر</title><desc id="desc">مدیر منابع انسانی ممکن است تصمیم‌گیر و خریدار سازمانی باشد، شرکت پرداخت کند و کارمند استفاده‌کننده باشد. مدیر به گزارش‌پذیری و کارمند به تمرین کوتاه نیاز دارد. این نقش‌ها در سناریوی فرضی سپهر ممکن است در یک نفر هم جمع شوند.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="28" fill="#fbfaf7"/><text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#19324a">در خرید سازمانی، خریدار و استفاده‌کننده یکی نیستند</text>
<rect x="90" y="140" width="300" height="190" rx="22" fill="#eaf0fa" stroke="#91a8d1" stroke-width="3"/><text x="240" y="185" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#344f7d">مدیر منابع انسانی</text><text x="240" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#19324a">تصمیم‌گیر / خریدار احتمالی</text><text x="240" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52657e">نیاز فرضی: گزارش‌پذیری</text><text x="240" y="304" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52657e">مثال آموزشی سپهر</text>
<rect x="810" y="140" width="300" height="190" rx="22" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="960" y="185" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#245744">کارمند</text><text x="960" y="230" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#19324a">استفاده‌کننده</text><text x="960" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52657e">نیاز فرضی: تمرین کوتاه</text><text x="960" y="304" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52657e">اصطکاک استفاده را جدا بسنج</text>
<rect x="435" y="390" width="330" height="120" rx="22" fill="#fff0df" stroke="#e4b77a" stroke-width="3"/><text x="600" y="435" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#80551d">شرکت / واحد پرداخت‌کننده</text><text x="600" y="475" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#19324a">بودجه، قرارداد و معیار موفقیت</text><path d="M390 235Q600 155 800 235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="600" y="164" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52657e">پیشنهاد باید هم ارزش خرید را روشن کند، هم تجربهٔ کاربر را</text><path d="M450 390Q370 340 315 332M750 390Q840 340 890 332" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="600" y="555" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52657e">در مصاحبه و طراحی پیشنهاد، تصمیم‌گیر، پرداخت‌کننده، استفاده‌کننده و مسئلهٔ هرکدام را جدا ثبت کن.</text></svg>
