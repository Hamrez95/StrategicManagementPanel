<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc"><title id="title">نقشهٔ فرضی استراتژی سپهر</title><desc id="desc">چهار منظر کارت امتیازی متوازن از یادگیری و رشد به فرایندهای داخلی، مشتری و پیامد مالی؛ پیکان‌ها فرضیه‌اند و رابطهٔ علّی را ثابت نمی‌کنند.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12" fill="none" stroke="#8090A4" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.heading{font-size:20px;font-weight:700}.body{font-size:16px}.caption{font-size:14px;fill:#63738A}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1240" y="45" text-anchor="end" class="heading">نقشهٔ فرضی استراتژی سپهر</text><rect x="1000" y="100" width="235" height="200" rx="22" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2" filter="url(#s)"/><text x="1217" y="142" text-anchor="end" class="heading">یادگیری و رشد</text><text x="1217" y="188" text-anchor="end" class="body">قابلیت تیم و آمادگی داده را تقویت کنیم.</text><path d="M982 200 L945 200" fill="none" stroke="#8090A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="100" width="235" height="200" rx="22" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2" filter="url(#s)"/><text x="907" y="142" text-anchor="end" class="heading">فرایندهای داخلی</text><text x="907" y="188" text-anchor="end" class="body">راه‌اندازی خدمت را دقیق‌تر و روان‌تر کنیم.</text><path d="M672 200 L635 200" fill="none" stroke="#8090A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="100" width="235" height="200" rx="22" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2" filter="url(#s)"/><text x="597" y="142" text-anchor="end" class="heading">مشتری</text><text x="597" y="188" text-anchor="end" class="body">تجربهٔ بهتر شاید به نگهداشت بیشتر کمک کند.</text><path d="M362 200 L325 200" fill="none" stroke="#8090A4" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="100" width="235" height="200" rx="22" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2" filter="url(#s)"/><text x="287" y="142" text-anchor="end" class="heading">مالی</text><text x="287" y="188" text-anchor="end" class="body">نگهداشت بیشتر می‌تواند به درآمد پایدار کمک کند.</text><text x="1240" y="345" text-anchor="end" class="caption">پیکان‌ها فرضیه‌های قابل‌آزمون‌اند؛ هم‌زمانی شاخص‌ها علت را ثابت نمی‌کند.</text></svg>