<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">مخرج درست در احتمال شرطی</title>
  <desc id="desc">مقایسهٔ ۱۰۰ سفارش کمپین و ۱۰۰ سفارش عادی. برای محاسبهٔ دیرکرد در هر گروه، تعداد دیرکرد را بر کل سفارش همان گروه تقسیم می‌کنیم؛ این تفاوت به‌تنهایی رابطهٔ علّی را ثابت نمی‌کند.</desc>
  <defs>
    <style>
      text{font-family:Vazirmatn,IRANSans,Tahoma,sans-serif;fill:#26364b}
      .title{font-size:26px;font-weight:700}.subtitle{font-size:16px;fill:#59677a}
      .head{font-size:17px;font-weight:700}.body{font-size:18px}.small{font-size:15px}
    </style>
  </defs>
  <rect width="960" height="560" rx="28" fill="#f7f8fc"/>
  <text x="480" y="58" text-anchor="middle" class="title" direction="rtl">احتمال شرطی یعنی مخرج را به گروه شرط محدود کن</text>
  <text x="480" y="91" text-anchor="middle" class="subtitle" direction="rtl">مثال آموزشی: مقایسهٔ دیرکرد سفارش‌های کمپین و عادی</text>
  <rect x="95" y="125" width="770" height="76" rx="18" fill="#e8eaff"/>
  <text x="480" y="158" text-anchor="middle" class="head" direction="rtl">پرسش: در میان سفارش‌های کمپین، چند درصد دیر رسیده‌اند؟</text>
  <text x="480" y="185" text-anchor="middle" class="small" direction="rtl">شرط «کمپین» مخرج را تعیین می‌کند؛ همهٔ سفارش‌ها مخرج این پاسخ نیستند.</text>
  <rect x="505" y="225" width="350" height="174" rx="22" fill="#e3f5ef" stroke="#b6e4d4" stroke-width="2"/>
  <rect x="105" y="225" width="350" height="174" rx="22" fill="#fff1e5" stroke="#f2d4b8" stroke-width="2"/>
  <text x="680" y="263" text-anchor="middle" class="head" direction="rtl">سفارش کمپین</text>
  <text x="280" y="263" text-anchor="middle" class="head" direction="rtl">سفارش عادی</text>
  <text x="680" y="306" text-anchor="middle" class="body" direction="rtl">۲۰ دیرکرد از ۱۰۰ سفارش</text>
  <text x="280" y="306" text-anchor="middle" class="body" direction="rtl">۱۰ دیرکرد از ۱۰۰ سفارش</text>
  <rect x="585" y="326" width="190" height="48" rx="14" fill="#c4eadc"/>
  <rect x="185" y="326" width="190" height="48" rx="14" fill="#f7d9bd"/>
  <text x="680" y="357" text-anchor="middle" class="head" direction="rtl">۲۰ ÷ ۱۰۰ = ۲۰٪</text>
  <text x="280" y="357" text-anchor="middle" class="head" direction="rtl">۱۰ ÷ ۱۰۰ = ۱۰٪</text>
  <path d="M680 408v27M280 408v27" stroke="#8290a3" stroke-width="2" stroke-dasharray="5 6"/>
  <rect x="95" y="444" width="770" height="76" rx="18" fill="#fff" stroke="#dfe4ed" stroke-width="2"/>
  <text x="480" y="474" text-anchor="middle" class="head" direction="rtl">نرخ گروهی را مقایسه کن؛ از آن علت قطعی نساز.</text>
  <text x="480" y="501" text-anchor="middle" class="small" direction="rtl">ترکیب مشتری، زمان، موجودی و مسیر تحویل می‌تواند تفاوت را توضیح دهد.</text>
</svg>
