<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">ساختار معامله و هم‌راستایی مشوق</title><desc id="d">قیمت نهایی تنها جزء معامله نیست؛ زمان پرداخت و شرط تحقق ریسک را جابه‌جا می‌کند. قیمت و پرداخت: وجه نقد، سهام، زمان پرداخت و مبنای ارزش‌گذاری را جداگانه مستند کن.؛ شرط و تعهد: شرایط تکمیل، تضمین‌ها، نگهداشت وجه و حل اختلاف را با مشاور بررسی کن.؛ پرداخت مشروط: earn-out می‌تواند فاصلهٔ ارزش‌گذاری را پوشش دهد، اما شاخص و کنترل بعد از معامله باید روشن باشد.؛ هم‌راستایی: مشوق فروشنده و خریدار را با سناریوی خوب، پایه و بد آزمایش کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">ساختار معامله و هم‌راستایی مشوق</text><text x="1150" y="86" text-anchor="end" class="sub">قیمت نهایی تنها جزء معامله نیست؛ زمان پرداخت و شرط تحقق ریسک را جابه‌جا می‌کند.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">قیمت و پرداخت</text><text x="1116" y="240" text-anchor="end" class="b">وجه نقد، سهام، زمان</text><text x="1116" y="270" text-anchor="end" class="b">پرداخت و مبنای ارزش‌گذاری</text><text x="1116" y="300" text-anchor="end" class="b">را جداگانه مستند کن.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">شرط و تعهد</text><text x="556" y="240" text-anchor="end" class="b">شرایط تکمیل، تضمین‌ها،</text><text x="556" y="270" text-anchor="end" class="b">نگهداشت وجه و حل اختلاف</text><text x="556" y="300" text-anchor="end" class="b">را با مشاور بررسی کن.</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">پرداخت مشروط</text><text x="1116" y="470" text-anchor="end" class="b">earn-out می‌تواند</text><text x="1116" y="500" text-anchor="end" class="b">فاصلهٔ ارزش‌گذاری را</text><text x="1116" y="530" text-anchor="end" class="b">پوشش دهد، اما شاخص و</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">هم‌راستایی</text><text x="556" y="470" text-anchor="end" class="b">مشوق فروشنده و خریدار</text><text x="556" y="500" text-anchor="end" class="b">را با سناریوی خوب،</text><text x="556" y="530" text-anchor="end" class="b">پایه و بد آزمایش کن.</text></g><text x="1150" y="674" text-anchor="end" class="foot">این نمودار ابزار آموزش مفهومی است و مشاورهٔ حقوقی یا سرمایه‌گذاری نیست.</text></svg>
