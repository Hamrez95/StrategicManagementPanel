<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">لایه‌های کنترل AI در گردش مالی حساس</title><desc id="desc">کنترل‌های داده و دسترسی، ارزیابی خروجی، تأیید اقدام، ثبت ممیزی و مسیر توقف را در پیرامون یک کاربرد مالی نشان می‌دهد.</desc>
<rect width="1200" height="700" rx="30" fill="#fbf8f2"/><text x="600" y="62" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#27364b">کنترل چندلایه برای کاربرد مالیِ حساس</text>
<rect x="420" y="120" width="360" height="105" rx="22" fill="#e7e1f5" stroke="#b5a8d8" stroke-width="3"/><text x="600" y="163" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="25" font-weight="700" fill="#514676">کاربرد AI</text><text x="600" y="198" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#514676">پیش‌بینی / تحلیل / پیشنهاد</text>
<rect x="110" y="280" width="290" height="120" rx="20" fill="#dcecf7"/><text x="255" y="325" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#3e6480">۱. داده و دسترسی</text><text x="255" y="360" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#3e6480">کمینه‌سازی، مجوز، جداسازی</text>
<rect x="455" y="280" width="290" height="120" rx="20" fill="#d9eee5"/><text x="600" y="325" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#276b5d">۲. ارزیابی خروجی</text><text x="600" y="360" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#276b5d">کیفیت، خطا، دامنهٔ کاربرد</text>
<rect x="800" y="280" width="290" height="120" rx="20" fill="#f8e8c5"/><text x="945" y="325" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" fill="#75561e">۳. تأیید اقدام</text><text x="945" y="360" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#75561e">سقف اختیار، انسان پاسخ‌گو</text>
<line x1="420" y1="225" x2="255" y2="280" stroke="#8192a4" stroke-width="3"/><line x1="600" y1="225" x2="600" y2="280" stroke="#8192a4" stroke-width="3"/><line x1="780" y1="225" x2="945" y2="280" stroke="#8192a4" stroke-width="3"/>
<rect x="245" y="465" width="310" height="105" rx="20" fill="#f6dcd5"/><text x="400" y="507" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" fill="#9b4b44">۴. ثبت و بررسی</text><text x="400" y="542" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#743f3b">نسخه، ورودی، تصمیم، رخداد</text>
<rect x="645" y="465" width="310" height="105" rx="20" fill="#e5ebef"/><text x="800" y="507" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" fill="#425264">۵. توقف و بازگشت</text><text x="800" y="542" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#425264">آستانه، مالک، مسیر جایگزین</text>
<line x1="400" y1="400" x2="400" y2="465" stroke="#8192a4" stroke-width="3"/><line x1="800" y1="400" x2="800" y2="465" stroke="#8192a4" stroke-width="3"/>
<text x="600" y="635" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#667386">تناسب کنترل با پیامد خطا و اختیار سامانه تعیین می‌شود؛ این شکل جای ارزیابی تخصصی را نمی‌گیرد.</text></svg>