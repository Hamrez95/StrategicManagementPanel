<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">ساخت یا خرید و هزینهٔ کل</title><desc id="d">مقایسه را از قیمت خرید فراتر ببر؛ هزینه و ریسک چرخهٔ عمر را هم ثبت کن. ساخت داخلی: ظرفیت، مهارت، کنترل و هزینهٔ فرصت منابع داخلی را بسنج.؛ خرید از بازار: قیمت، کیفیت، حمل، بازرسی و هزینهٔ هماهنگی را اضافه کن.؛ هزینهٔ کل مالکیت: قیمت + تحویل + کیفیت + موجودی + ریسک وابستگی را با افق یکسان جمع کن.؛ انتخاب و مذاکره: معیار و وزن را قبل از امتیازدهی بنویس؛ BATNA و حد توقف را روشن کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">ساخت یا خرید و هزینهٔ کل</text><text x="1150" y="86" text-anchor="end" class="sub">مقایسه را از قیمت خرید فراتر ببر؛ هزینه و ریسک چرخهٔ عمر را هم ثبت کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">ساخت داخلی</text><text x="1116" y="240" text-anchor="end" class="b">ظرفیت، مهارت، کنترل</text><text x="1116" y="270" text-anchor="end" class="b">و هزینهٔ فرصت منابع</text><text x="1116" y="300" text-anchor="end" class="b">داخلی را بسنج.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">خرید از بازار</text><text x="556" y="240" text-anchor="end" class="b">قیمت، کیفیت، حمل،</text><text x="556" y="270" text-anchor="end" class="b">بازرسی و هزینهٔ هماهنگی</text><text x="556" y="300" text-anchor="end" class="b">را اضافه کن.</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">هزینهٔ کل مالکیت</text><text x="1116" y="470" text-anchor="end" class="b">قیمت + تحویل + کیفیت</text><text x="1116" y="500" text-anchor="end" class="b">+ موجودی + ریسک وابستگی</text><text x="1116" y="530" text-anchor="end" class="b">را با افق یکسان جمع</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">انتخاب و مذاکره</text><text x="556" y="470" text-anchor="end" class="b">معیار و وزن را قبل از</text><text x="556" y="500" text-anchor="end" class="b">امتیازدهی بنویس؛ BATNA</text><text x="556" y="530" text-anchor="end" class="b">و حد توقف را روشن کن.</text></g><text x="1150" y="674" text-anchor="end" class="foot">وزن‌ها و پیش‌بینی‌ها قضاوت مدیریتی‌اند؛ با تحلیل حساسیت و دادهٔ قابل‌ردیابی همراهشان کن.</text></svg>
