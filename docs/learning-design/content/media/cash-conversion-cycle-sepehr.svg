<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">چرخهٔ تبدیل وجه نقد سپهر</title><desc id="desc">با فرض آموزشی، ۳۶ روز موجودی به علاوهٔ ۵۵ روز وصول منهای ۳۴ روز پرداخت، چرخهٔ نقد ۵۷ روز است. کاهش وصول به ۴۸ روز آن را به ۵۰ روز می‌رساند، پیش از سنجش هزینه و پیامد.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="560" rx="28" fill="#fbfaf7"/><text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#19324a">چرخهٔ تبدیل وجه نقد (CCC) | مثال فرضی سپهر</text>
<rect x="60" y="145" width="230" height="130" rx="20" fill="#eaf0fa" stroke="#91a8d1" stroke-width="3"/><text x="175" y="190" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#344f7d">پرداخت به فروشنده</text><text x="175" y="235" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#19324a">شروع چرخهٔ نقد</text>
<rect x="365" y="145" width="220" height="130" rx="20" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="475" y="192" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#245744">موجودی | DIO</text><text x="475" y="239" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#19324a">۳۶ روز</text>
<rect x="665" y="145" width="220" height="130" rx="20" fill="#fff0df" stroke="#e4b77a" stroke-width="3"/><text x="775" y="192" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#80551d">وصول | DSO</text><text x="775" y="239" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#19324a">۵۵ روز</text>
<rect x="960" y="145" width="190" height="130" rx="20" fill="#f8e9ef" stroke="#d49bb1" stroke-width="3"/><text x="1055" y="192" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#7a4059">دریافت وجه</text><text x="1055" y="239" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#19324a">پایان چرخه</text>
<path d="M290 210H355M585 210H655M885 210H950" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="210" y="340" width="780" height="135" rx="20" fill="#f0edf8" stroke="#a89acb" stroke-width="3"/><text x="600" y="383" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#58477c">زمان پرداخت به فروشنده بخشی از فاصله را تأمین می‌کند</text><text x="600" y="430" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#19324a">CCC = DIO + DSO − DPO = ۳۶ + ۵۵ − ۳۴ = ۵۷ روز</text><text x="600" y="515" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#52657e">اگر DSO به ۴۸ روز برسد، CCC=۵۰ روز؛ هزینهٔ تخفیف و اثر بر مشتری را هم بسنج.</text></svg>
