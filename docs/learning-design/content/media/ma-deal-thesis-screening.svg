<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">منطق معامله و غربال هدف</title><desc id="d">از مسئلهٔ راهبردی شروع کن؛ صرفِ بزرگ‌شدن یا هم‌افزایی ادعایی دلیل کافی نیست. خلأ راهبردی: کدام قابلیت، بازار یا زمان را می‌خواهی به دست بیاوری؟ گزینهٔ ساخت یا اتحاد را هم بسنج.؛ تناسب هدف: محصول، مشتری، فناوری، افراد و وابستگی‌ها را با مسئلهٔ اصلی تطبیق بده.؛ شاهد هم‌افزایی: منبع ارزش و هزینهٔ دستیابی را جدا کن؛ مالک، زمان و شرط تحقق را تعیین کن.؛ تصمیم مرحله‌ای: معیار توقف و دادهٔ لازم برای ورود به ارزیابی عمیق را پیش از هیجان معامله بنویس.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">منطق معامله و غربال هدف</text><text x="1150" y="86" text-anchor="end" class="sub">از مسئلهٔ راهبردی شروع کن؛ صرفِ بزرگ‌شدن یا هم‌افزایی ادعایی دلیل کافی نیست.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">خلأ راهبردی</text><text x="1116" y="240" text-anchor="end" class="b">کدام قابلیت، بازار یا</text><text x="1116" y="270" text-anchor="end" class="b">زمان را می‌خواهی به</text><text x="1116" y="300" text-anchor="end" class="b">دست بیاوری؟ گزینهٔ</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">تناسب هدف</text><text x="556" y="240" text-anchor="end" class="b">محصول، مشتری، فناوری،</text><text x="556" y="270" text-anchor="end" class="b">افراد و وابستگی‌ها را</text><text x="556" y="300" text-anchor="end" class="b">با مسئلهٔ اصلی تطبیق</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">شاهد هم‌افزایی</text><text x="1116" y="470" text-anchor="end" class="b">منبع ارزش و هزینهٔ</text><text x="1116" y="500" text-anchor="end" class="b">دستیابی را جدا کن؛</text><text x="1116" y="530" text-anchor="end" class="b">مالک، زمان و شرط تحقق</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">تصمیم مرحله‌ای</text><text x="556" y="470" text-anchor="end" class="b">معیار توقف و دادهٔ</text><text x="556" y="500" text-anchor="end" class="b">لازم برای ورود به</text><text x="556" y="530" text-anchor="end" class="b">ارزیابی عمیق را پیش</text></g><text x="1150" y="674" text-anchor="end" class="foot">این غربال چارچوب تصمیم است؛ ارزش معامله را بدون دادهٔ اختصاصی و بررسی مستقل تعیین نمی‌کند.</text></svg>
