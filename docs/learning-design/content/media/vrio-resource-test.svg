<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">آزمون VRIO برای منبع یا قابلیت</title><desc id="d">چهار پرسش ارزش، کمیابی، دشواری تقلید و سازمان‌دهی را به تفسیرهای مشروط از پیامد رقابتی پیوند می‌دهد.</desc><rect width="1200" height="760" rx="30" fill="#fbf8f2"/><text x="600" y="58" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#27364b">آزمون VRIO: منبع چه نوع مزیتی می‌سازد؟</text><text x="600" y="94" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#667386">هر پاسخ را با شواهد مشخص بسنجید؛ «بله» به‌تنهایی حکم قطعی نیست.</text>
<g font-family="Tahoma,Arial,sans-serif"><rect x="85" y="145" width="225" height="130" rx="22" fill="#e5f1f7"/><text x="197" y="188" text-anchor="middle" font-size="25" font-weight="700" fill="#3e6480">V · ارزشمند؟</text><text x="197" y="227" text-anchor="middle" font-size="17" fill="#27364b">به فرصت پاسخ می‌دهد</text><text x="197" y="252" text-anchor="middle" font-size="17" fill="#27364b">یا تهدید را کم می‌کند؟</text>
<rect x="365" y="145" width="225" height="130" rx="22" fill="#e7f2eb"/><text x="477" y="188" text-anchor="middle" font-size="25" font-weight="700" fill="#3d7653">R · کمیاب؟</text><text x="477" y="227" text-anchor="middle" font-size="17" fill="#27364b">رقبا همین توان را</text><text x="477" y="252" text-anchor="middle" font-size="17" fill="#27364b">به‌آسانی ندارند؟</text>
<rect x="645" y="145" width="225" height="130" rx="22" fill="#eee9f7"/><text x="757" y="188" text-anchor="middle" font-size="25" font-weight="700" fill="#66528f">I · تقلید دشوار؟</text><text x="757" y="227" text-anchor="middle" font-size="17" fill="#27364b">هزینه یا زمان تقلید</text><text x="757" y="252" text-anchor="middle" font-size="17" fill="#27364b">برای رقیب بالاست؟</text>
<rect x="925" y="145" width="225" height="130" rx="22" fill="#fff0e7"/><text x="1037" y="188" text-anchor="middle" font-size="25" font-weight="700" fill="#a76439">O · سازمان‌یافته؟</text><text x="1037" y="227" text-anchor="middle" font-size="17" fill="#27364b">ساختار و فرایند</text><text x="1037" y="252" text-anchor="middle" font-size="17" fill="#27364b">ارزش را جذب می‌کنند؟</text>
<line x1="310" y1="210" x2="365" y2="210" stroke="#8290a0" stroke-width="4"/><line x1="590" y1="210" x2="645" y2="210" stroke="#8290a0" stroke-width="4"/><line x1="870" y1="210" x2="925" y2="210" stroke="#8290a0" stroke-width="4"/>
<rect x="70" y="340" width="250" height="135" rx="22" fill="#f6dcd5"/><text x="195" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#9b4b44">V = خیر</text><text x="195" y="426" text-anchor="middle" font-size="19" fill="#27364b">ضعف رقابتی محتمل</text><text x="195" y="453" text-anchor="middle" font-size="15" fill="#667386">ارزش را بازبینی کنید</text>
<rect x="350" y="340" width="250" height="135" rx="22" fill="#e5ebef"/><text x="475" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#425264">V = بله، R = خیر</text><text x="475" y="426" text-anchor="middle" font-size="19" fill="#27364b">برابری رقابتی محتمل</text><text x="475" y="453" text-anchor="middle" font-size="15" fill="#667386">توان ارزشمند رایج است</text>
<rect x="630" y="340" width="250" height="135" rx="22" fill="#f4e4bf"/><text x="755" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#75561e">V = بله، R = بله، I = خیر</text><text x="755" y="426" text-anchor="middle" font-size="19" fill="#27364b">مزیت موقت محتمل</text><text x="755" y="453" text-anchor="middle" font-size="15" fill="#667386">رقیب می‌تواند تقلید کند</text>
<rect x="910" y="340" width="250" height="135" rx="22" fill="#d9eee5"/><text x="1035" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#276b5d">V, R, I = بله</text><text x="1035" y="426" text-anchor="middle" font-size="19" fill="#27364b">سازمان را بررسی کنید</text><text x="1035" y="453" text-anchor="middle" font-size="15" fill="#667386">O = خیر؟ مزیت جذب نمی‌شود</text>
<path d="M197 275 V320 H195 V340" fill="none" stroke="#b77367" stroke-width="3"/><path d="M477 275 V320 H475 V340" fill="none" stroke="#8290a0" stroke-width="3"/><path d="M757 275 V320 H755 V340" fill="none" stroke="#c19b54" stroke-width="3"/><path d="M1037 275 V320 H1035 V340" fill="none" stroke="#618e83" stroke-width="3"/>
<rect x="190" y="535" width="820" height="105" rx="22" fill="#e7e1f5"/><text x="600" y="578" text-anchor="middle" font-size="22" font-weight="700" fill="#514676">اگر V, R, I و O همگی برقرار باشند</text><text x="600" y="613" text-anchor="middle" font-size="19" fill="#27364b">مزیت پایدار بالقوه؛ دوام آن به تغییر رقبا، بازار و قابلیت‌های پویا وابسته است.</text></g><text x="600" y="694" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#667386">چارچوب تشخیصی است؛ منبع، رقیب مرجع و افق زمانی را روشن و شواهد هر پاسخ را مستند کنید.</text></svg>