<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">ماتریس SPACE</title><desc id="desc">صفحه مختصات SPACE با چهار جهت‌گیری تهاجمی، محافظه‌کارانه، تدافعی و رقابتی، و نقطهٔ نمونهٔ فرضی یک و یک.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.t{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#68768A}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1080" y="48" text-anchor="end" class="t">SPACE؛ موضع را از چهار بُعد بساز</text><text x="1080" y="82" text-anchor="end" class="s">X = IS + CA = +۱؛ Y = FS + ES = +۱؛ مثال فرضی سپهر</text><line x1="540" y1="145" x2="540" y2="500" stroke="#A9B4C4" stroke-width="2"/><line x1="300" y1="325" x2="790" y2="325" stroke="#A9B4C4" stroke-width="2"/><rect x="545" y="150" width="235" height="170" rx="18" fill="#E8F5ED"/><rect x="305" y="150" width="230" height="170" rx="18" fill="#EAF1FF"/><rect x="305" y="330" width="230" height="165" rx="18" fill="#FCEAF0"/><rect x="545" y="330" width="235" height="165" rx="18" fill="#FFF2E3"/><text x="770" y="185" text-anchor="end" class="h">تهاجمی</text><text x="525" y="185" text-anchor="end" class="h">محافظه‌کارانه</text><text x="525" y="470" text-anchor="end" class="h">تدافعی</text><text x="770" y="470" text-anchor="end" class="h">رقابتی</text><circle cx="580" cy="290" r="12" fill="#536FA9" stroke="#FFFFFF" stroke-width="4"/><text x="615" y="290" class="s">(+۱,+۱)؛ نزدیک مرکز</text><text x="790" y="530" text-anchor="middle" class="s">X: IS + CA</text><text x="270" y="320" text-anchor="middle" class="s" transform="rotate(-90 270 320)">Y: FS + ES</text><text x="1080" y="574" text-anchor="end" class="s">نقطهٔ نزدیک مرکز به تغییر نمره حساس است؛ جهت، تصمیم نهایی نیست.</text></svg>