<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">بررسی موشکافانه و دفتر شواهد</title><desc id="d">برای هر فرض، مدرک، مالک بررسی، ابهام و پیامد تصمیم را کنار هم ثبت کن. بازار و مشتری: تمرکز درآمد، حفظ مشتری، قرارداد و اعتبار تقاضا را با دادهٔ مستقل بررسی کن.؛ مالی و عملیات: کیفیت سود، سرمایهٔ در گردش، ظرفیت و گلوگاه‌ها را با فرض‌های قابل‌ردیابی بسنج.؛ فناوری و داده: مالکیت، امنیت، کیفیت داده، بدهی فنی و وابستگی فروشنده را بررسی کن.؛ افراد، قانون و AI: نقش‌های کلیدی، تعهدها و ریسک‌های مدل را ثبت کن؛ مورد نامعلوم را «حل‌شده» نشان نده.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">بررسی موشکافانه و دفتر شواهد</text><text x="1150" y="86" text-anchor="end" class="sub">برای هر فرض، مدرک، مالک بررسی، ابهام و پیامد تصمیم را کنار هم ثبت کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">بازار و مشتری</text><text x="1116" y="240" text-anchor="end" class="b">تمرکز درآمد، حفظ مشتری،</text><text x="1116" y="270" text-anchor="end" class="b">قرارداد و اعتبار تقاضا</text><text x="1116" y="300" text-anchor="end" class="b">را با دادهٔ مستقل</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">مالی و عملیات</text><text x="556" y="240" text-anchor="end" class="b">کیفیت سود، سرمایهٔ در</text><text x="556" y="270" text-anchor="end" class="b">گردش، ظرفیت و گلوگاه‌ها</text><text x="556" y="300" text-anchor="end" class="b">را با فرض‌های قابل‌ردیابی</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">فناوری و داده</text><text x="1116" y="470" text-anchor="end" class="b">مالکیت، امنیت، کیفیت</text><text x="1116" y="500" text-anchor="end" class="b">داده، بدهی فنی و</text><text x="1116" y="530" text-anchor="end" class="b">وابستگی فروشنده را</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">افراد، قانون و AI</text><text x="556" y="470" text-anchor="end" class="b">نقش‌های کلیدی، تعهدها</text><text x="556" y="500" text-anchor="end" class="b">و ریسک‌های مدل را ثبت</text><text x="556" y="530" text-anchor="end" class="b">کن؛ مورد نامعلوم را</text></g><text x="1150" y="674" text-anchor="end" class="foot">چراغ سبز/زرد/قرمز باید به مدرک و سطح اطمینان وصل باشد؛ دامنهٔ حقوقی هر بررسی جداست.</text></svg>
