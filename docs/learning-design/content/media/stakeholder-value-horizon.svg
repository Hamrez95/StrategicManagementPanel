<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">ذی‌نفعان و افق ارزش</title><desc id="d">تصمیم مدیریتی می‌تواند منافع کوتاه‌مدت و پیامدهای بلندمدت را متفاوت توزیع کند. تصمیم و دامنه: موضوع، دورهٔ زمانی و مرز سازمان را روشن کن؛ چه چیزی داخل سنجش است؟؛ ذی‌نفع و اثر: کارکنان، مشتری، تأمین‌کننده، جامعه و سرمایه‌گذار را با پیامد واقعی مرتبط کن.؛ مبادله و اختیار: چه کسی سود می‌برد و چه کسی هزینه می‌دهد؟ اختیار تصمیم و صدای ذی‌نفع را بنویس.؛ تعهد و پیگیری: هدف، شاخص، مالک و زمان بازبینی را ثبت کن؛ ادعا را به شاهد وصل نگه دار.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">ذی‌نفعان و افق ارزش</text><text x="1150" y="86" text-anchor="end" class="sub">تصمیم مدیریتی می‌تواند منافع کوتاه‌مدت و پیامدهای بلندمدت را متفاوت توزیع کند.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">تصمیم و دامنه</text><text x="1116" y="240" text-anchor="end" class="b">موضوع، دورهٔ زمانی و</text><text x="1116" y="270" text-anchor="end" class="b">مرز سازمان را روشن</text><text x="1116" y="300" text-anchor="end" class="b">کن؛ چه چیزی داخل سنجش</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">ذی‌نفع و اثر</text><text x="556" y="240" text-anchor="end" class="b">کارکنان، مشتری،</text><text x="556" y="270" text-anchor="end" class="b">تأمین‌کننده، جامعه و</text><text x="556" y="300" text-anchor="end" class="b">سرمایه‌گذار را با</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">مبادله و اختیار</text><text x="1116" y="470" text-anchor="end" class="b">چه کسی سود می‌برد و</text><text x="1116" y="500" text-anchor="end" class="b">چه کسی هزینه می‌دهد؟</text><text x="1116" y="530" text-anchor="end" class="b">اختیار تصمیم و صدای</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">تعهد و پیگیری</text><text x="556" y="470" text-anchor="end" class="b">هدف، شاخص، مالک و زمان</text><text x="556" y="500" text-anchor="end" class="b">بازبینی را ثبت کن؛</text><text x="556" y="530" text-anchor="end" class="b">ادعا را به شاهد وصل</text></g><text x="1150" y="674" text-anchor="end" class="foot">این چارچوب جایگزین تحلیل زمینه‌ای نیست؛ فهرست ذی‌نفعان و اهمیتشان در هر تصمیم فرق دارد.</text></svg>
