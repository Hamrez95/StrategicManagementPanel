<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">چرخهٔ اعتبارسنجی و پایش مدل AI</title><desc id="desc">کاربرد و ریسک تعریف می‌شود؛ دادهٔ آزمون مستقل و نماینده انتخاب می‌شود؛ مدل با خط مبنا و معیارهای کلی و زیرگروهی مقایسه می‌شود؛ نتیجه، محدودیت و عدم‌قطعیت بررسی می‌شود؛ پس از استقرار پایش، مسئول تصمیم و اختیار توقف تعیین می‌شود. افت عملکرد به بازبینی و آزمون تازه برمی‌گردد.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="700" rx="28" fill="#fbfaf7"/><text x="600" y="54" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#19324a">اعتبارسنجی مدل، پیش از استقرار و در زمان استفاده</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="70" y="145" width="290" height="135" rx="20" fill="#eaf0fa" stroke="#91a8d1" stroke-width="3"/><text x="215" y="190" font-size="22" font-weight="700" fill="#344f7d">۱. کاربرد و ریسک</text><text x="215" y="230" font-size="18" fill="#19324a">چه تصمیمی؟ چه پیامدی؟</text><text x="215" y="258" font-size="16" fill="#52657e">واحد، جمعیت و محدودیت را ثبت کن</text>
<rect x="455" y="145" width="290" height="135" rx="20" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="600" y="190" font-size="22" font-weight="700" fill="#245744">۲. داده و آزمون</text><text x="600" y="230" font-size="18" fill="#19324a">آزمون مستقل و نماینده</text><text x="600" y="258" font-size="16" fill="#52657e">نشت داده و نمونه‌های دشوار را ببین</text>
<rect x="840" y="145" width="290" height="135" rx="20" fill="#fff0df" stroke="#e4b77a" stroke-width="3"/><text x="985" y="190" font-size="22" font-weight="700" fill="#80551d">۳. معیار و خط مبنا</text><text x="985" y="230" font-size="18" fill="#19324a">کلی، زیرگروهی و متناسب با زیان</text><text x="985" y="258" font-size="16" fill="#52657e">فقط دقت کلی کافی نیست</text>
<rect x="840" y="390" width="290" height="135" rx="20" fill="#f0edf8" stroke="#a89acb" stroke-width="3"/><text x="985" y="435" font-size="22" font-weight="700" fill="#58477c">۴. نتیجه و محدودیت</text><text x="985" y="475" font-size="18" fill="#19324a">عدم‌قطعیت و خطا را مستند کن</text><text x="985" y="503" font-size="16" fill="#52657e">آیا بهبود، هزینه و ریسک را توجیه می‌کند؟</text>
<rect x="455" y="390" width="290" height="135" rx="20" fill="#f8e9ef" stroke="#d49bb1" stroke-width="3"/><text x="600" y="435" font-size="22" font-weight="700" fill="#7a4059">۵. پایش و مسئولیت</text><text x="600" y="475" font-size="18" fill="#19324a">آستانه، مالک تصمیم و مسیر ارجاع</text><text x="600" y="503" font-size="16" fill="#52657e">اختیار توقف و بازگشت امن</text>
<rect x="70" y="390" width="290" height="135" rx="20" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="215" y="435" font-size="22" font-weight="700" fill="#245744">۶. بازبینی در محیط واقعی</text><text x="215" y="475" font-size="18" fill="#19324a">افت یا تغییر داده؟ دوباره بسنج</text><text x="215" y="503" font-size="16" fill="#52657e">کاربرد و محیط ممکن است عوض شوند</text></g>
<path d="M360 212H445M745 212H830M985 280V380M840 458H755M455 458H370" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M215 390V325Q215 305 235 305H600Q620 305 620 285" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="600" y="625" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52657e">آستانهٔ توقف باید به زیان تصمیم وصل باشد؛ تأیید انسانی بدون اختیار و زمان، کنترل مؤثر نیست.</text><text x="600" y="660" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#7b8794">راهنمای مفهومی تألیفی؛ برای تعریف ریسک و سنجش، به NIST AI RMF ارجاع شود.</text></svg>
