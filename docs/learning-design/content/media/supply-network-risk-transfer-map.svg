<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">شبکهٔ تأمین، تحویل و انتقال ریسک</title><desc id="d">مسیر فیزیکی، جریان داده و مسئولیت را در هر نقطهٔ تحویل جدا ببین. نقشهٔ شبکه: تأمین‌کننده، مرکز، مسیر، انبار و مشتری را به هم وصل کن.؛ زمان و ظرفیت: زمان تحویل و محدودیت ظرفیت هر گره را مشخص کن؛ گلوگاه را پیدا کن.؛ انتقال مسئولیت: شرط تحویل، مالک ریسک و نقطهٔ انتقال را از قرارداد و رویه بخوان.؛ رویداد و رهگیری: شناسه، زمان، مکان و وضعیت کالا را ثبت کن؛ دادهٔ ناقص را پرچم بزن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">شبکهٔ تأمین، تحویل و انتقال ریسک</text><text x="1150" y="86" text-anchor="end" class="sub">مسیر فیزیکی، جریان داده و مسئولیت را در هر نقطهٔ تحویل جدا ببین.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">نقشهٔ شبکه</text><text x="1116" y="240" text-anchor="end" class="b">تأمین‌کننده، مرکز،</text><text x="1116" y="270" text-anchor="end" class="b">مسیر، انبار و مشتری</text><text x="1116" y="300" text-anchor="end" class="b">را به هم وصل کن.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">زمان و ظرفیت</text><text x="556" y="240" text-anchor="end" class="b">زمان تحویل و محدودیت</text><text x="556" y="270" text-anchor="end" class="b">ظرفیت هر گره را مشخص</text><text x="556" y="300" text-anchor="end" class="b">کن؛ گلوگاه را پیدا</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">انتقال مسئولیت</text><text x="1116" y="470" text-anchor="end" class="b">شرط تحویل، مالک ریسک</text><text x="1116" y="500" text-anchor="end" class="b">و نقطهٔ انتقال را از</text><text x="1116" y="530" text-anchor="end" class="b">قرارداد و رویه بخوان.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">رویداد و رهگیری</text><text x="556" y="470" text-anchor="end" class="b">شناسه، زمان، مکان و</text><text x="556" y="500" text-anchor="end" class="b">وضعیت کالا را ثبت کن؛</text><text x="556" y="530" text-anchor="end" class="b">دادهٔ ناقص را پرچم</text></g><text x="1150" y="674" text-anchor="end" class="foot">نقشه مفهومی است؛ مفاد قراردادی و قانون حمل‌ونقل باید برای مسیر واقعی جدا بررسی شوند.</text></svg>
