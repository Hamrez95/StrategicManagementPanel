<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">رشد تکرارپذیر و کیفیت اقتصاد واحد</title><desc id="d">رشد را به حفظ مشتری، ظرفیت تحویل و حاشیهٔ مشارکت متصل کن. تکرارپذیری: کانال و رفتار مشتری را در چند cohort بسنج؛ یک جهش فروش کافی نیست.؛ اقتصاد واحد: درآمد خالص، هزینهٔ متغیر و هزینهٔ جذب را در واحد مشترک محاسبه کن.؛ گلوگاه رشد: ظرفیت تیم، پشتیبانی، کیفیت و نقدینگی را با حجم بعدی مقایسه کن.؛ بازار توسعه: تقاضا، دسترسی، رقابت و هزینهٔ بومی‌سازی را پیش از ورود بسنج.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">رشد تکرارپذیر و کیفیت اقتصاد واحد</text><text x="1150" y="86" text-anchor="end" class="sub">رشد را به حفظ مشتری، ظرفیت تحویل و حاشیهٔ مشارکت متصل کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#fff" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">تکرارپذیری</text><text x="1116" y="240" text-anchor="end" class="b">کانال و رفتار مشتری</text><text x="1116" y="270" text-anchor="end" class="b">را در چند cohort بسنج؛</text><text x="1116" y="300" text-anchor="end" class="b">یک جهش فروش کافی نیست.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#fff" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">اقتصاد واحد</text><text x="556" y="240" text-anchor="end" class="b">درآمد خالص، هزینهٔ</text><text x="556" y="270" text-anchor="end" class="b">متغیر و هزینهٔ جذب</text><text x="556" y="300" text-anchor="end" class="b">را در واحد مشترک</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#fff" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">گلوگاه رشد</text><text x="1116" y="470" text-anchor="end" class="b">ظرفیت تیم، پشتیبانی،</text><text x="1116" y="500" text-anchor="end" class="b">کیفیت و نقدینگی را</text><text x="1116" y="530" text-anchor="end" class="b">با حجم بعدی مقایسه</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#fff" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">بازار توسعه</text><text x="556" y="470" text-anchor="end" class="b">تقاضا، دسترسی، رقابت</text><text x="556" y="500" text-anchor="end" class="b">و هزینهٔ بومی‌سازی</text><text x="556" y="530" text-anchor="end" class="b">را پیش از ورود بسنج.</text></g><text x="1150" y="674" text-anchor="end" class="foot">نمودار آموزشی تألیفی است؛ دامنه و فرض‌ها را با دادهٔ واقعی هر سازمان تطبیق بده.</text></svg>
