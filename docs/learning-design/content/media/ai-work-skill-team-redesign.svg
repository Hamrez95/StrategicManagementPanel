<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">مهارت، همکاری و بازطراحی نقش</title><desc id="d">نقش را بر اساس تغییر وظیفه و کیفیت واقعی بازطراحی کن، نه وعدهٔ ابزار. مهارت مکمل: کار قابل‌تقویت با AI را از کار قابل‌جایگزینی و قضاوت انسانی جدا کن.؛ همکاری تخصصی: تقسیم کار را با پیچیدگی مسئله و وابستگی دانش هماهنگ کن.؛ بار نظارت: کیفیت، خستگی توجه و نرخ اصلاح را کنار سرعت پایش کن.؛ بازطراحی نقش: مسئولیت، آموزش، مشارکت کارکنان و موعد بازبینی را تعیین کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">مهارت، همکاری و بازطراحی نقش</text><text x="1150" y="86" text-anchor="end" class="sub">نقش را بر اساس تغییر وظیفه و کیفیت واقعی بازطراحی کن، نه وعدهٔ ابزار.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#fff" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">مهارت مکمل</text><text x="1116" y="240" text-anchor="end" class="b">کار قابل‌تقویت با AI</text><text x="1116" y="270" text-anchor="end" class="b">را از کار قابل‌جایگزینی</text><text x="1116" y="300" text-anchor="end" class="b">و قضاوت انسانی جدا</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#fff" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">همکاری تخصصی</text><text x="556" y="240" text-anchor="end" class="b">تقسیم کار را با پیچیدگی</text><text x="556" y="270" text-anchor="end" class="b">مسئله و وابستگی دانش</text><text x="556" y="300" text-anchor="end" class="b">هماهنگ کن.</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#fff" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">بار نظارت</text><text x="1116" y="470" text-anchor="end" class="b">کیفیت، خستگی توجه و</text><text x="1116" y="500" text-anchor="end" class="b">نرخ اصلاح را کنار</text><text x="1116" y="530" text-anchor="end" class="b">سرعت پایش کن.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#fff" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">بازطراحی نقش</text><text x="556" y="470" text-anchor="end" class="b">مسئولیت، آموزش، مشارکت</text><text x="556" y="500" text-anchor="end" class="b">کارکنان و موعد بازبینی</text><text x="556" y="530" text-anchor="end" class="b">را تعیین کن.</text></g><text x="1150" y="674" text-anchor="end" class="foot">نمودار آموزشی تألیفی است؛ دامنه و فرض‌ها را با دادهٔ واقعی هر سازمان تطبیق بده.</text></svg>
