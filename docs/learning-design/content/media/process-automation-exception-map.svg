<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">طراحی فرایند و نظارت بر AI</title><desc id="d">اتوماسیون باید استثنا، مالک تصمیم و سنجهٔ پیش و پس داشته باشد. گزینهٔ فرایند: سرعت، کیفیت، انعطاف و هزینه را با واحد و دامنهٔ یکسان مقایسه کن.؛ استثنا و اختیار: چه زمانی کار به انسان برمی‌گردد و چه کسی پاسخ‌گوست؟؛ پایش AI: خطا، تغییر داده و مداخلهٔ انسانی را با مسئول مشخص ثبت کن.؛ اثر بهبود: خط مبنا و سنجهٔ توازن را پیش و پس از تغییر بسنج.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">طراحی فرایند و نظارت بر AI</text><text x="1150" y="86" text-anchor="end" class="sub">اتوماسیون باید استثنا، مالک تصمیم و سنجهٔ پیش و پس داشته باشد.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#fff" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">گزینهٔ فرایند</text><text x="1116" y="240" text-anchor="end" class="b">سرعت، کیفیت، انعطاف</text><text x="1116" y="270" text-anchor="end" class="b">و هزینه را با واحد و</text><text x="1116" y="300" text-anchor="end" class="b">دامنهٔ یکسان مقایسه</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#fff" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">استثنا و اختیار</text><text x="556" y="240" text-anchor="end" class="b">چه زمانی کار به انسان</text><text x="556" y="270" text-anchor="end" class="b">برمی‌گردد و چه کسی</text><text x="556" y="300" text-anchor="end" class="b">پاسخ‌گوست؟</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#fff" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">پایش AI</text><text x="1116" y="470" text-anchor="end" class="b">خطا، تغییر داده و</text><text x="1116" y="500" text-anchor="end" class="b">مداخلهٔ انسانی را با</text><text x="1116" y="530" text-anchor="end" class="b">مسئول مشخص ثبت کن.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#fff" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">اثر بهبود</text><text x="556" y="470" text-anchor="end" class="b">خط مبنا و سنجهٔ توازن</text><text x="556" y="500" text-anchor="end" class="b">را پیش و پس از تغییر</text><text x="556" y="530" text-anchor="end" class="b">بسنج.</text></g><text x="1150" y="674" text-anchor="end" class="foot">نمودار آموزشی تألیفی است؛ دامنه و فرض‌ها را با دادهٔ واقعی هر سازمان تطبیق بده.</text></svg>
