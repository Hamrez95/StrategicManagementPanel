<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="555" viewBox="0 0 1280 555" role="img" aria-labelledby="title desc"><title id="title">مراحل قیف رشد</title><desc id="desc">قیف پنج مرحله‌ای آگاهی، ورود، فعال‌سازی، تبدیل و حفظ؛ افت نرخ محل بررسی است و به‌تنهایی علت را مشخص نمی‌کند.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#68768A}.number{font-size:23px;font-weight:700}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1240" y="48" text-anchor="end" class="title">قیف رشد؛ افت را پیدا کن، علت را جداگانه بررسی کن</text><polygon points="160,110 1120,110 1065,172 215,172" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2"/><text x="640" y="150" text-anchor="middle" class="head">آگاهی</text><polygon points="227,186 1053,186 998,248 282,248" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2"/><text x="640" y="226" text-anchor="middle" class="head">ورود</text><polygon points="294,262 986,262 931,324 349,324" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2"/><text x="640" y="302" text-anchor="middle" class="head">فعال‌سازی</text><polygon points="361,338 919,338 864,400 416,400" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2"/><text x="640" y="378" text-anchor="middle" class="head">تبدیل</text><polygon points="428,414 852,414 797,476 483,476" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2"/><text x="640" y="454" text-anchor="middle" class="head">حفظ</text><text x="1240" y="515" text-anchor="end" class="small">افراد ممکن است مرحله‌ای را رد کنند یا از مسیر دیگری وارد شوند؛ هر نرخ، رویداد و مخرج مشخص می‌خواهد.</text></svg>