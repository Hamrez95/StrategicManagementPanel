<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">نقدینگی، بقا و انتخاب تأمین مالی</title><desc id="d">سرمایهٔ لازم را به زمان بقا و نقطهٔ عطف وصل کن؛ درصد سهام تنها هزینه نیست. منبع پول: درآمد، سرمایهٔ شخصی، بدهی یا سرمایه‌گذار را با شرط و ریسک بسنج.؛ نرخ سوخت و runway: نقد قابل‌استفاده را بر مصرف خالص دوره تقسیم کن؛ سناریو بساز.؛ رقیق‌شدن: درصد مالکیت قبل و بعد از سرمایه‌گذاری را با فرض تبدیل و اختیار محاسبه کن.؛ ارائهٔ شواهد: بازار، استفاده، اقتصاد واحد و ریسک را با دادهٔ قابل‌ردیابی نشان بده.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">نقدینگی، بقا و انتخاب تأمین مالی</text><text x="1150" y="86" text-anchor="end" class="sub">سرمایهٔ لازم را به زمان بقا و نقطهٔ عطف وصل کن؛ درصد سهام تنها هزینه نیست.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#fff" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">منبع پول</text><text x="1116" y="240" text-anchor="end" class="b">درآمد، سرمایهٔ شخصی،</text><text x="1116" y="270" text-anchor="end" class="b">بدهی یا سرمایه‌گذار</text><text x="1116" y="300" text-anchor="end" class="b">را با شرط و ریسک بسنج.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#fff" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">نرخ سوخت و runway</text><text x="556" y="240" text-anchor="end" class="b">نقد قابل‌استفاده را</text><text x="556" y="270" text-anchor="end" class="b">بر مصرف خالص دوره</text><text x="556" y="300" text-anchor="end" class="b">تقسیم کن؛ سناریو بساز.</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#fff" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">رقیق‌شدن</text><text x="1116" y="470" text-anchor="end" class="b">درصد مالکیت قبل و بعد</text><text x="1116" y="500" text-anchor="end" class="b">از سرمایه‌گذاری را</text><text x="1116" y="530" text-anchor="end" class="b">با فرض تبدیل و اختیار</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#fff" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">ارائهٔ شواهد</text><text x="556" y="470" text-anchor="end" class="b">بازار، استفاده، اقتصاد</text><text x="556" y="500" text-anchor="end" class="b">واحد و ریسک را با</text><text x="556" y="530" text-anchor="end" class="b">دادهٔ قابل‌ردیابی</text></g><text x="1150" y="674" text-anchor="end" class="foot">نمودار آموزشی تألیفی است؛ دامنه و فرض‌ها را با دادهٔ واقعی هر سازمان تطبیق بده.</text></svg>
