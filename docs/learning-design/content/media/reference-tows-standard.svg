<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img"><title>TOWS Matrix</title><desc>Heinz Weihrich (1982). Combinations generate options; they do not rank them.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#333"/></marker></defs><rect width="1100" height="720" fill="white"/><g font-family="Arial, sans-serif" fill="#171717"><text x="550" y="54" font-size="32" text-anchor="middle">TOWS Matrix</text><rect x="280" y="125" width="360" height="100" fill="#edf3f6" stroke="#222" stroke-width="2"/><text x="460" y="175" font-size="23" text-anchor="middle">Strengths (S)</text><rect x="640" y="125" width="360" height="100" fill="#edf3f6" stroke="#222" stroke-width="2"/><text x="820" y="175" font-size="23" text-anchor="middle">Weaknesses (W)</text><rect x="40" y="225" width="240" height="170" fill="#edf3f6" stroke="#222" stroke-width="2"/><text x="160" y="310" font-size="23" text-anchor="middle">Opportunities (O)</text><rect x="40" y="395" width="240" height="170" fill="#edf3f6" stroke="#222" stroke-width="2"/><text x="160" y="480" font-size="23" text-anchor="middle">Threats (T)</text><rect x="280" y="225" width="360" height="170" fill="#fff" stroke="#222" stroke-width="2"/><text x="460" y="278" font-size="23" text-anchor="middle">SO</text><text x="460" y="310" font-size="23" text-anchor="middle">Use strengths</text><text x="460" y="342" font-size="23" text-anchor="middle">to pursue opportunities</text><rect x="640" y="225" width="360" height="170" fill="#fff" stroke="#222" stroke-width="2"/><text x="820" y="278" font-size="23" text-anchor="middle">WO</text><text x="820" y="310" font-size="23" text-anchor="middle">Address weaknesses</text><text x="820" y="342" font-size="23" text-anchor="middle">to pursue opportunities</text><rect x="280" y="395" width="360" height="170" fill="#fff" stroke="#222" stroke-width="2"/><text x="460" y="448" font-size="23" text-anchor="middle">ST</text><text x="460" y="480" font-size="23" text-anchor="middle">Use strengths</text><text x="460" y="512" font-size="23" text-anchor="middle">to reduce threats</text><rect x="640" y="395" width="360" height="170" fill="#fff" stroke="#222" stroke-width="2"/><text x="820" y="448" font-size="23" text-anchor="middle">WT</text><text x="820" y="480" font-size="23" text-anchor="middle">Reduce weaknesses</text><text x="820" y="512" font-size="23" text-anchor="middle">and exposure to threats</text><text x="550" y="678" font-size="17" text-anchor="middle">Heinz Weihrich (1982). Combinations generate options; they do not rank them.</text><text x="550" y="705" font-size="14" text-anchor="middle">Independent educational drawing by Stratino. Not publisher artwork. CC BY 4.0.</text></g></svg>
