<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">خانواده‌های نسبت مالی</title><desc id="d">چهار گروه نسبت نقدینگی، اهرمی، سودآوری و کارایی را به پرسش مدیریتی، یک نمونه فرمول و محدودیت تفسیر وصل می‌کند.</desc><rect width="1200" height="760" rx="30" fill="#fbf8f2"/><text x="600" y="62" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#27364b">نسبت مالی را با پرسش درست بخوانید</text><text x="600" y="98" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#667386">نمونه‌های متداول؛ تعریف دقیق و مقایسه به صورت مالی و صنعت وابسته است</text>
<g font-family="Tahoma,Arial,sans-serif"><rect x="75" y="145" width="500" height="220" rx="24" fill="#e5f1f7" stroke="#a9cddd" stroke-width="2"/><text x="325" y="188" text-anchor="middle" font-size="25" font-weight="700" fill="#3e6480">نقدینگی</text><text x="325" y="229" text-anchor="middle" font-size="19" fill="#27364b">آیا تعهد کوتاه‌مدت قابل پرداخت است؟</text><rect x="120" y="250" width="410" height="50" rx="14" fill="#fff"/><text x="325" y="282" text-anchor="middle" font-size="19" fill="#3e6480">دارایی جاری ÷ بدهی جاری</text><text x="325" y="334" text-anchor="middle" font-size="16" fill="#667386">کیفیت دارایی جاری و زمان وصول را هم ببینید.</text>
<rect x="625" y="145" width="500" height="220" rx="24" fill="#eee9f7" stroke="#c2b5df" stroke-width="2"/><text x="875" y="188" text-anchor="middle" font-size="25" font-weight="700" fill="#66528f">اهرم مالی</text><text x="875" y="229" text-anchor="middle" font-size="19" fill="#27364b">تأمین مالی و تعهد بدهی چه ریسکی دارد؟</text><rect x="670" y="250" width="410" height="50" rx="14" fill="#fff"/><text x="875" y="282" text-anchor="middle" font-size="19" fill="#66528f">بدهی ÷ حقوق صاحبان سهام</text><text x="875" y="334" text-anchor="middle" font-size="16" fill="#667386">تعریف بدهی و صنعت بر مقایسه اثر دارند.</text>
<rect x="75" y="405" width="500" height="220" rx="24" fill="#e7f2eb" stroke="#b1d2ba" stroke-width="2"/><text x="325" y="448" text-anchor="middle" font-size="25" font-weight="700" fill="#3d7653">سودآوری</text><text x="325" y="489" text-anchor="middle" font-size="19" fill="#27364b">از فروش چه مقدار سود باقی می‌ماند؟</text><rect x="120" y="510" width="410" height="50" rx="14" fill="#fff"/><text x="325" y="542" text-anchor="middle" font-size="19" fill="#3d7653">سود خالص ÷ فروش</text><text x="325" y="594" text-anchor="middle" font-size="16" fill="#667386">حاشیه را با روند و ترکیب محصول بخوانید.</text>
<rect x="625" y="405" width="500" height="220" rx="24" fill="#fff0e7" stroke="#ecc4a7" stroke-width="2"/><text x="875" y="448" text-anchor="middle" font-size="25" font-weight="700" fill="#a76439">کارایی دارایی</text><text x="875" y="489" text-anchor="middle" font-size="19" fill="#27364b">دارایی برای ساخت فروش چگونه به‌کار می‌رود؟</text><rect x="670" y="510" width="410" height="50" rx="14" fill="#fff"/><text x="875" y="542" text-anchor="middle" font-size="19" fill="#a76439">فروش ÷ میانگین دارایی</text><text x="875" y="594" text-anchor="middle" font-size="16" fill="#667386">برون‌سپاری و دارایی نامشهود مقایسه را عوض می‌کنند.</text></g><rect x="190" y="670" width="820" height="52" rx="16" fill="#f4e4bf"/><text x="600" y="703" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#75561e">یک نسبت منفرد حکم قطعی نیست: روند، همتا، کیفیت داده و زمینه را کنار آن ببینید.</text></svg>