<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">سبد تحول و اولویت اجرا</title><desc id="d">انتخاب پروژه باید ارزش، آمادگی، وابستگی و ریسک اجرا را هم‌زمان ببیند. تعریف نتیجه: هر پروژه را به پیامد قابل مشاهده و مالک کسب‌وکار متصل کن.؛ برآورد و شواهد: خط مبنا و اندازهٔ اثر را جدا از حدس ثبت کن؛ عدم‌قطعیت را پنهان نکن.؛ وابستگی و ظرفیت: ترتیب پروژه‌ها را با نیاز داده، نیروی متخصص، تغییر فرایند و سامانه بسنج.؛ پایلوت و تصمیم: معیار ادامه، اصلاح یا توقف را از پیش تعیین کن؛ نتیجه را به سبد برگردان.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">سبد تحول و اولویت اجرا</text><text x="1150" y="86" text-anchor="end" class="sub">انتخاب پروژه باید ارزش، آمادگی، وابستگی و ریسک اجرا را هم‌زمان ببیند.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">تعریف نتیجه</text><text x="1116" y="240" text-anchor="end" class="b">هر پروژه را به پیامد</text><text x="1116" y="270" text-anchor="end" class="b">قابل مشاهده و مالک</text><text x="1116" y="300" text-anchor="end" class="b">کسب‌وکار متصل کن.</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">برآورد و شواهد</text><text x="556" y="240" text-anchor="end" class="b">خط مبنا و اندازهٔ اثر</text><text x="556" y="270" text-anchor="end" class="b">را جدا از حدس ثبت کن؛</text><text x="556" y="300" text-anchor="end" class="b">عدم‌قطعیت را پنهان</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">وابستگی و ظرفیت</text><text x="1116" y="470" text-anchor="end" class="b">ترتیب پروژه‌ها را با</text><text x="1116" y="500" text-anchor="end" class="b">نیاز داده، نیروی متخصص،</text><text x="1116" y="530" text-anchor="end" class="b">تغییر فرایند و سامانه</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">پایلوت و تصمیم</text><text x="556" y="470" text-anchor="end" class="b">معیار ادامه، اصلاح یا</text><text x="556" y="500" text-anchor="end" class="b">توقف را از پیش تعیین</text><text x="556" y="530" text-anchor="end" class="b">کن؛ نتیجه را به سبد</text></g><text x="1150" y="674" text-anchor="end" class="foot">امتیازهای اولویت قراردادی‌اند؛ وزن‌ها را اعلام کن و با تغییر فرض حساسیت‌سنجی کن.</text></svg>
