<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img" aria-labelledby="title desc"><title id="title">از خروجی AI تا تصمیم مدیریتی</title><desc id="desc">نمودار جریان از تعریف داده و هدف، خروجی مدل، قاعدهٔ تصمیم با هزینه و ظرفیت، تا اقدام دارای بازبینی انسانی.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#68768A}.number{font-size:23px;font-weight:700}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1240" y="48" text-anchor="end" class="title">پیش‌بینی، خودش تصمیم مدیریتی نیست</text><text x="1240" y="82" text-anchor="end" class="small">مدل احتمال یا رتبه می‌دهد؛ سیاست، پیامد و اختیار اقدام را تعیین می‌کند.</text><rect x="970" y="145" width="255" height="145" rx="20" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2" filter="url(#shadow)"/><text x="1207" y="179" text-anchor="end" class="head">داده و هدف</text><text x="1207" y="213" text-anchor="end" class="body">واحد مشاهده و تعریف موفقیت</text><rect x="665" y="145" width="255" height="145" rx="20" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2" filter="url(#shadow)"/><text x="902" y="179" text-anchor="end" class="head">خروجی مدل</text><text x="902" y="213" text-anchor="end" class="body">مثلاً احتمال دیرکرد: ۰٫۷</text><rect x="360" y="145" width="255" height="145" rx="20" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2" filter="url(#shadow)"/><text x="597" y="179" text-anchor="end" class="head">قاعدهٔ تصمیم</text><text x="597" y="213" text-anchor="end" class="body">آستانه + هزینهٔ خطا + ظرفیت پاسخ</text><rect x="55" y="145" width="255" height="145" rx="20" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2" filter="url(#shadow)"/><text x="292" y="179" text-anchor="end" class="head">اقدام با بازبینی</text><text x="292" y="213" text-anchor="end" class="body">هشدار، بررسی انسانی و اصلاح داده</text><path d="M950 218 L916 218" stroke="#8290A3" stroke-width="3" marker-end="url(#arrow)"/><path d="M645 218 L611 218" stroke="#8290A3" stroke-width="3" marker-end="url(#arrow)"/><path d="M340 218 L306 218" stroke="#8290A3" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="340" width="1170" height="120" rx="22" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/><text x="1185" y="385" text-anchor="end" class="head">دو خطا، دو هزینهٔ متفاوت</text><text x="1185" y="423" text-anchor="end" class="body">هشدار بی‌مورد (مثبت کاذب) و خطرِ دیده‌نشده (منفی کاذب) را جدا بسنج.</text><text x="1240" y="515" text-anchor="end" class="small">آستانه باید با پیامد برای افراد، انصاف، حریم خصوصی و ظرفیت تیم بازبینی شود.</text></svg>