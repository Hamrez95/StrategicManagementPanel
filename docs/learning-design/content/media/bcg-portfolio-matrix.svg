<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">ماتریس سبد BCG</title><desc id="desc">ماتریس رشد بازار و سهم نسبی با چهار خانه و نقطهٔ مثال فرضی سپهر در خانهٔ علامت سؤال.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".08"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#8290A3" stroke-width="1.8"/></marker></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.t{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#68768A}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><text x="1080" y="48" text-anchor="end" class="t">BCG؛ رشد بازار و سهم نسبی را از هم جدا کن</text><text x="1080" y="82" text-anchor="end" class="s">مثال آموزشی: رشد بازار ۱۲٪؛ سهم نسبی ۰٫۵؛ مرزهای تمرین ۱۰٪ و ۱.</text><rect x="550" y="130" width="460" height="160" rx="18" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2" filter="url(#s)"/><text x="994" y="160" text-anchor="end" class="h">علامت سؤال</text><text x="994" y="190" text-anchor="end" class="b" style="font-size:15px">رشد بالا؛ سهم نسبی پایین</text><rect x="70" y="130" width="460" height="160" rx="18" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2" filter="url(#s)"/><text x="514" y="160" text-anchor="end" class="h">ستاره</text><text x="514" y="190" text-anchor="end" class="b" style="font-size:15px">رشد بالا؛ سهم نسبی بالا</text><rect x="550" y="320" width="460" height="160" rx="18" fill="#F3F5F8" stroke="#D6DCE6" stroke-width="2" filter="url(#s)"/><text x="994" y="350" text-anchor="end" class="h">سگ / پت</text><text x="994" y="380" text-anchor="end" class="b" style="font-size:15px">رشد پایین؛ سهم نسبی پایین</text><rect x="70" y="320" width="460" height="160" rx="18" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2" filter="url(#s)"/><text x="514" y="350" text-anchor="end" class="h">گاو شیرده</text><text x="514" y="380" text-anchor="end" class="b" style="font-size:15px">رشد پایین؛ سهم نسبی بالا</text><circle cx="860" cy="220" r="13" fill="#506FAE" stroke="#FFFFFF" stroke-width="4"/><text x="830" y="226" text-anchor="end" class="s">سپهر؛ ۰٫۵ / ۱۲٪</text><text x="1080" y="540" text-anchor="end" class="s">در تمرین، مرزها قراردادی‌اند؛ رشد و سهم را همراه با نقد و استراتژی تفسیر کن.</text></svg>