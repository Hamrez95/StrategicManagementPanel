<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">گفت‌وگوی چندفرهنگی و میانجی‌گری</title><desc id="d">فرهنگ را فرضیه‌ای برای پرسیدن بدان، نه برچسبی برای پیش‌بینی رفتار افراد. ۱ | قواعد گفت‌وگو: هدف، محرمانگی، نوبت و اختیار را روشن کن؛ بپرس هر طرف چه چیزی را امن و منصفانه می‌داند.؛ ۲ | روایت و واقعیت: روایت هر طرف را جدا بشنو؛ مشاهده، تفسیر و ادعای اثبات‌نشده را تفکیک کن.؛ ۳ | منفعت و بازقاب‌بندی: اختلاف را از شخصیت جدا کن؛ نیاز و محدودیت پشت موضع را با زبان بی‌طرف بازگو کن.؛ ۴ | گزینه و پیگیری: گزینه‌ها را با رضایت طرف‌ها بساز؛ مسئول، زمان و راه بازگشت به گفت‌وگو را ثبت کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">گفت‌وگوی چندفرهنگی و میانجی‌گری</text><text x="1150" y="86" text-anchor="end" class="sub">فرهنگ را فرضیه‌ای برای پرسیدن بدان، نه برچسبی برای پیش‌بینی رفتار افراد.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">۱ | قواعد گفت‌وگو</text><text x="1116" y="240" text-anchor="end" class="b">هدف، محرمانگی، نوبت</text><text x="1116" y="270" text-anchor="end" class="b">و اختیار را روشن کن؛</text><text x="1116" y="300" text-anchor="end" class="b">بپرس هر طرف چه چیزی</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">۲ | روایت و واقعیت</text><text x="556" y="240" text-anchor="end" class="b">روایت هر طرف را جدا</text><text x="556" y="270" text-anchor="end" class="b">بشنو؛ مشاهده، تفسیر</text><text x="556" y="300" text-anchor="end" class="b">و ادعای اثبات‌نشده را</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">۳ | منفعت و بازقاب‌بندی</text><text x="1116" y="470" text-anchor="end" class="b">اختلاف را از شخصیت</text><text x="1116" y="500" text-anchor="end" class="b">جدا کن؛ نیاز و محدودیت</text><text x="1116" y="530" text-anchor="end" class="b">پشت موضع را با زبان</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">۴ | گزینه و پیگیری</text><text x="556" y="470" text-anchor="end" class="b">گزینه‌ها را با رضایت</text><text x="556" y="500" text-anchor="end" class="b">طرف‌ها بساز؛ مسئول،</text><text x="556" y="530" text-anchor="end" class="b">زمان و راه بازگشت به</text></g><text x="1150" y="674" text-anchor="end" class="foot">میانجی بی‌طرف به تصمیم‌گیری طرف‌ها کمک می‌کند؛ اختیار تحمیل راه‌حل ندارد مگر توافق یا قانون چیز دیگری بگوید.</text></svg>
