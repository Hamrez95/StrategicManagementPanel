<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">آزمایش، CAC، LTV و رشد</title><desc id="d">رشد را به هزینهٔ جذب، حاشیه، حفظ و کیفیت شواهد وصل کن. آزمایش قیمت: فرضیه، کنترل، معیار اصلی و مدت را پیشاپیش تعیین کن؛ هم‌زمانی علت نیست.؛ CAC کانالی: هزینهٔ منتسب به کانال را بر مشتری جدید همان کانال تقسیم کن؛ روش انتساب را بگو.؛ LTV و cohort: حاشیهٔ مشارکت و ماندگاری هر گروه را در زمان ببین؛ ریزش را پنهان نکن.؛ رشد سالم: بازگشت هزینه، حفظ، کیفیت و شکایت را با هم پایش کن؛ نسبت واحد قانون جهان‌شمول نیست.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">آزمایش، CAC، LTV و رشد</text><text x="1150" y="86" text-anchor="end" class="sub">رشد را به هزینهٔ جذب، حاشیه، حفظ و کیفیت شواهد وصل کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#fff" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">آزمایش قیمت</text><text x="1116" y="240" text-anchor="end" class="b">فرضیه، کنترل، معیار</text><text x="1116" y="270" text-anchor="end" class="b">اصلی و مدت را پیشاپیش</text><text x="1116" y="300" text-anchor="end" class="b">تعیین کن؛ هم‌زمانی</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#fff" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">CAC کانالی</text><text x="556" y="240" text-anchor="end" class="b">هزینهٔ منتسب به کانال</text><text x="556" y="270" text-anchor="end" class="b">را بر مشتری جدید همان</text><text x="556" y="300" text-anchor="end" class="b">کانال تقسیم کن؛ روش</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#fff" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">LTV و cohort</text><text x="1116" y="470" text-anchor="end" class="b">حاشیهٔ مشارکت و ماندگاری</text><text x="1116" y="500" text-anchor="end" class="b">هر گروه را در زمان</text><text x="1116" y="530" text-anchor="end" class="b">ببین؛ ریزش را پنهان</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#fff" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">رشد سالم</text><text x="556" y="470" text-anchor="end" class="b">بازگشت هزینه، حفظ،</text><text x="556" y="500" text-anchor="end" class="b">کیفیت و شکایت را با</text><text x="556" y="530" text-anchor="end" class="b">هم پایش کن؛ نسبت واحد</text></g><text x="1150" y="674" text-anchor="end" class="foot">مثال‌ها و معیارها را با دادهٔ زمینهٔ واقعی و فرض‌های آشکار ارزیابی کن.</text></svg>
