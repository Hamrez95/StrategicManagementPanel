<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">ارزش، کشش، بخش‌بندی و شواهد قیمت</title><desc id="d">تصمیم قیمت را با رفتار مشتری و طراحی شواهد بسنج، نه فقط با فهرست قیمت رقبا. تمایل به پرداخت: ارزش و گزینهٔ جایگزین را تعریف کن؛ اظهار نظر را با رفتار خرید مقایسه کن.؛ کشش و داده: درصد تغییر مقدار را به درصد تغییر قیمت نسبت بده؛ بخش و دوره را ثابت نگه دار.؛ بخش‌بندی قیمت: شرط دسترسی و بسته را روشن کن؛ تفاوت قیمت را با تفاوت ارزش یا هزینه توجیه‌پذیر کن.؛ شواهد علّی: هم‌زمانی تغییر قیمت و فروش اثر را ثابت نمی‌کند؛ گروه کنترل یا طراحی مناسب لازم است.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">ارزش، کشش، بخش‌بندی و شواهد قیمت</text><text x="1150" y="86" text-anchor="end" class="sub">تصمیم قیمت را با رفتار مشتری و طراحی شواهد بسنج، نه فقط با فهرست قیمت رقبا.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#fff" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">تمایل به پرداخت</text><text x="1116" y="240" text-anchor="end" class="b">ارزش و گزینهٔ جایگزین</text><text x="1116" y="270" text-anchor="end" class="b">را تعریف کن؛ اظهار</text><text x="1116" y="300" text-anchor="end" class="b">نظر را با رفتار خرید</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#fff" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">کشش و داده</text><text x="556" y="240" text-anchor="end" class="b">درصد تغییر مقدار را</text><text x="556" y="270" text-anchor="end" class="b">به درصد تغییر قیمت</text><text x="556" y="300" text-anchor="end" class="b">نسبت بده؛ بخش و دوره</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#fff" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">بخش‌بندی قیمت</text><text x="1116" y="470" text-anchor="end" class="b">شرط دسترسی و بسته را</text><text x="1116" y="500" text-anchor="end" class="b">روشن کن؛ تفاوت قیمت</text><text x="1116" y="530" text-anchor="end" class="b">را با تفاوت ارزش یا</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#fff" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">شواهد علّی</text><text x="556" y="470" text-anchor="end" class="b">هم‌زمانی تغییر قیمت</text><text x="556" y="500" text-anchor="end" class="b">و فروش اثر را ثابت</text><text x="556" y="530" text-anchor="end" class="b">نمی‌کند؛ گروه کنترل</text></g><text x="1150" y="674" text-anchor="end" class="foot">مثال‌ها و معیارها را با دادهٔ زمینهٔ واقعی و فرض‌های آشکار ارزیابی کن.</text></svg>
