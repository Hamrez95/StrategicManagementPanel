<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">وابستگی زنجیره و مسیر بازیابی</title><desc id="d">ریسک یک گره را از مسیر اثر تا خدمت حیاتی و ظرفیت جایگزین دنبال کن. وابستگی بحرانی: تأمین‌کننده، فناوری، مکان یا نفر یگانه را به فرایند وابسته وصل کن.؛ پیامد و عدم‌قطعیت: خدمت متاثر، مدت اختلال و گروه در معرض اثر را مشخص کن.؛ هشدار و سناریو: تریگر قابل‌مشاهده و سناریوی تمرین را تعریف کن؛ احتمال را دقیق‌نمایی نکن.؛ گزینهٔ بازیابی: منبع جایگزین، موجودی، تغییر مسیر و زمان بازیابی را با ظرفیت واقعی بسنج.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">وابستگی زنجیره و مسیر بازیابی</text><text x="1150" y="86" text-anchor="end" class="sub">ریسک یک گره را از مسیر اثر تا خدمت حیاتی و ظرفیت جایگزین دنبال کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">وابستگی بحرانی</text><text x="1116" y="240" text-anchor="end" class="b">تأمین‌کننده، فناوری،</text><text x="1116" y="270" text-anchor="end" class="b">مکان یا نفر یگانه را</text><text x="1116" y="300" text-anchor="end" class="b">به فرایند وابسته وصل</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">پیامد و عدم‌قطعیت</text><text x="556" y="240" text-anchor="end" class="b">خدمت متاثر، مدت اختلال</text><text x="556" y="270" text-anchor="end" class="b">و گروه در معرض اثر را</text><text x="556" y="300" text-anchor="end" class="b">مشخص کن.</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">هشدار و سناریو</text><text x="1116" y="470" text-anchor="end" class="b">تریگر قابل‌مشاهده و</text><text x="1116" y="500" text-anchor="end" class="b">سناریوی تمرین را تعریف</text><text x="1116" y="530" text-anchor="end" class="b">کن؛ احتمال را دقیق‌نمایی</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">گزینهٔ بازیابی</text><text x="556" y="470" text-anchor="end" class="b">منبع جایگزین، موجودی،</text><text x="556" y="500" text-anchor="end" class="b">تغییر مسیر و زمان</text><text x="556" y="530" text-anchor="end" class="b">بازیابی را با ظرفیت</text></g><text x="1150" y="674" text-anchor="end" class="foot">احتمال × اثر ابزار غربال است، نه پیش‌بینی دقیق؛ کیفیت داده و دامنهٔ سناریو را ثبت کن.</text></svg>
