<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">تقسیم زمانی داده برای پیش‌بینی مالی</title><desc id="desc">مقایسهٔ تقسیم تصادفی دارای خطر نشت با ارزیابی زمانی؛ ویژگی‌ها باید فقط از اطلاعات در دسترس تا زمان پیش‌بینی ساخته شوند.</desc>
<rect width="1200" height="700" rx="32" fill="#fbf8f2"/><text x="600" y="62" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#27364b">پیش‌بینی مالی: زمانِ دسترسی به داده مهم است</text>
<rect x="72" y="105" width="500" height="505" rx="26" fill="#fff0ec" stroke="#f0b6a5" stroke-width="3"/><text x="322" y="155" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#9b4b44">تقسیم تصادفی — خطر نشت</text>
<line x1="130" y1="252" x2="510" y2="252" stroke="#8c9aaa" stroke-width="5"/><text x="130" y="225" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">گذشته</text><text x="465" y="225" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">آینده</text>
<circle cx="175" cy="252" r="18" fill="#72b7a5"/><circle cx="245" cy="252" r="18" fill="#f1aa98"/><circle cx="315" cy="252" r="18" fill="#72b7a5"/><circle cx="385" cy="252" r="18" fill="#f1aa98"/><circle cx="455" cy="252" r="18" fill="#72b7a5"/><text x="322" y="315" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#27364b">نمونه‌های آینده وارد آموزش می‌شوند</text><text x="322" y="350" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">یا اطلاعات یک دوره در هر دو مجموعه تکرار می‌شود</text>
<rect x="125" y="405" width="395" height="62" rx="16" fill="#f8d6cc"/><text x="322" y="445" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#743f3b">امتیاز آزمون ممکن است خوش‌بینانه شود</text><text x="322" y="520" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">مدل آینده را با دانسته‌های آینده می‌بیند</text>
<rect x="628" y="105" width="500" height="505" rx="26" fill="#edf6f3" stroke="#9acfc0" stroke-width="3"/><text x="878" y="155" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="700" fill="#276b5d">تقسیم زمانی — شبیه‌تر به کاربرد</text>
<line x1="690" y1="252" x2="1070" y2="252" stroke="#8c9aaa" stroke-width="5"/><rect x="700" y="218" width="190" height="68" rx="14" fill="#bfe4d8"/><rect x="905" y="218" width="78" height="68" rx="14" fill="#d9d0f2"/><rect x="998" y="218" width="62" height="68" rx="14" fill="#f4d8a5"/><text x="795" y="260" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#24594f">آموزش</text><text x="944" y="260" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="15" fill="#514676">اعتبار</text><text x="1029" y="260" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="15" fill="#75561e">آزمون</text>
<line x1="900" y1="320" x2="900" y2="365" stroke="#618e83" stroke-width="3" stroke-dasharray="8 7"/><text x="878" y="405" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#27364b">ویژگی در زمان پیش‌بینی</text><text x="878" y="440" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">فقط اطلاعاتی که تا این نقطه</text><text x="878" y="470" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#556274">واقعاً در دسترس بوده است</text><rect x="690" y="520" width="375" height="55" rx="15" fill="#cfe9df"/><text x="878" y="555" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#24594f">آزمون روی دورهٔ بعدی</text>
<text x="600" y="655" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#667386">طرح شماتیک آموزشی؛ واحد زمانی و پنجرهٔ آزمون را با مسئلهٔ واقعی تطبیق دهید.</text></svg>