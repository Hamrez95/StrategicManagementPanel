<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc"><title id="title">نقشهٔ فرایند درخواست خدمت سپهر</title><desc id="desc">درخواست مشتری ثبت می‌شود. اگر اطلاعات ناقص باشد برای تکمیل برمی‌گردد و دوباره وارد ثبت می‌شود. اگر کامل باشد تشخیص مسئله، حل یا ارجاع، تأیید مشتری و بستن پرونده انجام می‌شود. زمان انتظار، فعالیت و بازکاری باید جدا ثبت شوند.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1300" height="650" rx="28" fill="#fbfaf7"/><text x="650" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#19324a">فرایند خدمت سپهر | واحد جریان: یک درخواست مشتری</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="55" y="220" width="180" height="115" rx="18" fill="#eaf0fa" stroke="#91a8d1" stroke-width="3"/><text x="145" y="270" font-size="21" font-weight="700" fill="#344f7d">ورود درخواست</text><text x="145" y="305" font-size="17" fill="#52657e">ثبت زمان شروع</text><rect x="300" y="220" width="180" height="115" rx="18" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="390" y="270" font-size="21" font-weight="700" fill="#245744">ثبت و تکمیل</text><text x="390" y="305" font-size="17" fill="#52657e">بررسی اطلاعات</text><polygon points="600,205 690,277 600,350 510,277" fill="#fff0df" stroke="#e4b77a" stroke-width="3"/><text x="600" y="270" font-size="18" font-weight="700" fill="#80551d">کامل است؟</text><text x="600" y="297" font-size="16" fill="#80551d">تصمیم</text><rect x="735" y="220" width="170" height="115" rx="18" fill="#f0edf8" stroke="#a89acb" stroke-width="3"/><text x="820" y="270" font-size="20" font-weight="700" fill="#58477c">تشخیص مسئله</text><text x="820" y="305" font-size="17" fill="#52657e">زمان فعالیت</text><rect x="950" y="220" width="170" height="115" rx="18" fill="#e6f4ee" stroke="#83bda4" stroke-width="3"/><text x="1035" y="270" font-size="20" font-weight="700" fill="#245744">حل یا ارجاع</text><text x="1035" y="305" font-size="17" fill="#52657e">ثبت بازکاری</text><rect x="1160" y="220" width="115" height="115" rx="18" fill="#f8e9ef" stroke="#d49bb1" stroke-width="3"/><text x="1217" y="265" font-size="18" font-weight="700" fill="#7a4059">تأیید</text><text x="1217" y="295" font-size="17" fill="#7a4059">و بستن</text></g>
<path d="M235 277H290M480 277H500M690 277H725M905 277H940M1120 277H1150" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="710" y="205" font-family="sans-serif" font-size="16" fill="#245744">بله</text><path d="M600 350V445H390V345" fill="none" stroke="#c07b4c" stroke-width="3" marker-end="url(#a)"/><rect x="300" y="470" width="180" height="90" rx="16" fill="#fff0df" stroke="#e4b77a" stroke-width="3"/><text x="390" y="510" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#80551d">درخواست تکمیل</text><text x="390" y="540" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#80551d">انتظار و بازگشت</text><text x="620" y="430" font-family="sans-serif" font-size="16" fill="#9a5d28">خیر</text><text x="650" y="610" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52657e">زمان فعالیت، انتظار و بازکاری را جدا بسنج؛ نقشه را با نمونه‌های واقعی از پرونده‌ها تأیید کن.</text></svg>
