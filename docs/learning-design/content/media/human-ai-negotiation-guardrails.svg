<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">عامل هوش مصنوعی در مذاکره</title><desc id="d">پیشنهاد، تحلیل و پذیرش توافق سه سطح اختیار متفاوت‌اند. داده و افشا: محدودهٔ دادهٔ مجاز و شیوهٔ اعلام استفاده از AI را پیش از مذاکره مشخص کن.؛ اختیار محدود: عامل می‌تواند گزینه و خلاصه بسازد؛ سقف پیشنهاد، مخاطب و اقدام مجاز باید بسته باشد.؛ تأیید انسان: تعهد، پذیرش نهایی یا تغییر توافق با تأیید انسانیِ مجاز انجام شود.؛ ثبت و ارزیابی: خطا، انصاف، کیفیت توافق و امکان اعتراض را ثبت کن؛ مسیر توقف و اصلاح داشته باش.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">عامل هوش مصنوعی در مذاکره</text><text x="1150" y="86" text-anchor="end" class="sub">پیشنهاد، تحلیل و پذیرش توافق سه سطح اختیار متفاوت‌اند.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">داده و افشا</text><text x="1116" y="240" text-anchor="end" class="b">محدودهٔ دادهٔ مجاز و</text><text x="1116" y="270" text-anchor="end" class="b">شیوهٔ اعلام استفاده</text><text x="1116" y="300" text-anchor="end" class="b">از AI را پیش از مذاکره</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">اختیار محدود</text><text x="556" y="240" text-anchor="end" class="b">عامل می‌تواند گزینه</text><text x="556" y="270" text-anchor="end" class="b">و خلاصه بسازد؛ سقف</text><text x="556" y="300" text-anchor="end" class="b">پیشنهاد، مخاطب و اقدام</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">تأیید انسان</text><text x="1116" y="470" text-anchor="end" class="b">تعهد، پذیرش نهایی یا</text><text x="1116" y="500" text-anchor="end" class="b">تغییر توافق با تأیید</text><text x="1116" y="530" text-anchor="end" class="b">انسانیِ مجاز انجام</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">ثبت و ارزیابی</text><text x="556" y="470" text-anchor="end" class="b">خطا، انصاف، کیفیت</text><text x="556" y="500" text-anchor="end" class="b">توافق و امکان اعتراض</text><text x="556" y="530" text-anchor="end" class="b">را ثبت کن؛ مسیر توقف</text></g><text x="1150" y="674" text-anchor="end" class="foot">سطح خودکارسازی را با هزینهٔ خطا، برگشت‌پذیری تصمیم و حساسیت اطلاعات متناسب کن.</text></svg>
