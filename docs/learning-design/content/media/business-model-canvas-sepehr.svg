<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="590" viewBox="0 0 1267 590" role="img" aria-labelledby="title desc"><title id="title">بوم نمونهٔ سپهر؛ فرضیه‌های اولیه</title><desc id="desc">بوم مدل کسب‌وکار با نه خانه: شرکای کلیدی، فعالیت‌های کلیدی، منابع کلیدی، ارزش پیشنهادی، رابطه با مشتری، کانال‌ها، بخش‌های مشتری، ساختار هزینه و جریان‌های درآمد.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24324A" flood-opacity=".08"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.heading{font-size:20px;font-weight:700}.body{font-size:15px}.example{font-size:14px;font-weight:600;fill:#456178}.hint{font-size:13px;fill:#6A7789}</style><rect width="100%" height="100%" rx="26" fill="#F8FAFD"/><g><rect x="30" y="110" width="235" height="275" rx="20" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2"/><text x="245" y="144" text-anchor="end" class="heading">شرکای کلیدی</text><text x="245" y="177" text-anchor="end" class="body">چه کسی منابع، تخصص یا دسترسی لازم را می‌آورد؟</text><text x="245" y="215" text-anchor="end" class="example">فرض: دسترسی به مدل AI؛ وابستگی و ریسک داده را بررسی کن.</text></g><g><rect x="273" y="110" width="235" height="131" rx="20" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2"/><text x="488" y="144" text-anchor="end" class="heading">فعالیت‌های کلیدی</text><text x="488" y="177" text-anchor="end" class="body">برای تحویل ارزش، چه کارهایی باید عالی انجام شوند؟</text><text x="488" y="215" text-anchor="end" class="example">فرض: رسیدگی به درخواست‌ها و بهبود کیفیت پاسخ.</text></g><g><rect x="273" y="251" width="235" height="134" rx="20" fill="#EAF1FF" stroke="#C6D5F4" stroke-width="2"/><text x="488" y="285" text-anchor="end" class="heading">منابع کلیدی</text><text x="488" y="318" text-anchor="end" class="body">چه تیم، داده، فناوری یا دانشی لازم است؟</text><text x="488" y="356" text-anchor="end" class="example">فرض: دانش پاسخ‌گویی، سامانه و نیروی انسانی.</text></g><g><rect x="516" y="110" width="235" height="275" rx="20" fill="#E8F5ED" stroke="#B9DCC5" stroke-width="2"/><text x="731" y="144" text-anchor="end" class="heading">ارزش پیشنهادی</text><text x="731" y="177" text-anchor="end" class="body">کدام مسئلهٔ مشتری را با چه نتیجه‌ای حل می‌کنیم؟</text><text x="731" y="215" text-anchor="end" class="example">فرض: حل سریع‌تر درخواست پشتیبانی برای شرکت کوچک.</text></g><g><rect x="759" y="110" width="235" height="131" rx="20" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2"/><text x="974" y="144" text-anchor="end" class="heading">رابطه با مشتری</text><text x="974" y="177" text-anchor="end" class="body">چطور جذب، همراهی و حفظ مشتری را پیش می‌بریم؟</text><text x="974" y="215" text-anchor="end" class="example">فرض: پشتیبانی و بازبینی ماهانهٔ خدمت.</text></g><g><rect x="759" y="251" width="235" height="134" rx="20" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2"/><text x="974" y="285" text-anchor="end" class="heading">کانال‌ها</text><text x="974" y="318" text-anchor="end" class="body">مشتری چطور آگاه، خرید و خدمت را دریافت می‌کند؟</text><text x="974" y="356" text-anchor="end" class="example">فرض: فروش مستقیم به شرکت‌های کوچک.</text></g><g><rect x="1002" y="110" width="235" height="275" rx="20" fill="#F2ECFF" stroke="#D4C7F1" stroke-width="2"/><text x="1217" y="144" text-anchor="end" class="heading">بخش‌های مشتری</text><text x="1217" y="177" text-anchor="end" class="body">برای چه کسی ارزش می‌سازیم؟ کاربر و پرداخت‌کننده کیست؟</text><text x="1217" y="215" text-anchor="end" class="example">فرض: شرکت‌های کوچک با درخواست پشتیبانی پرتکرار.</text></g><g><rect x="30" y="393" width="721" height="155" rx="20" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2"/><text x="731" y="427" text-anchor="end" class="heading">ساختار هزینه</text><text x="731" y="460" text-anchor="end" class="body">کدام منابع و فعالیت‌ها بیشترین هزینه را می‌سازند؟</text><text x="731" y="498" text-anchor="end" class="example">فرض: نیروی انسانی، رایانش و نگهداری سامانه.</text></g><g><rect x="759" y="393" width="478" height="155" rx="20" fill="#FFF2E3" stroke="#EBD2AE" stroke-width="2"/><text x="1217" y="427" text-anchor="end" class="heading">جریان‌های درآمد</text><text x="1217" y="460" text-anchor="end" class="body">چه کسی بابت چه چیزی، چه وقت و چطور می‌پردازد؟</text><text x="1217" y="498" text-anchor="end" class="example">فرض: اشتراک دوره‌ای خدمت.</text></g><text x="1237" y="574" text-anchor="end" class="hint">سناریوی فرضی است؛ هیچ خانه‌ای واقعیت تأییدشده نیست.</text></svg>