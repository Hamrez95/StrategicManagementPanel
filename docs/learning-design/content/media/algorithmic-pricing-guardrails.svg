<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">قیمت‌گذاری الگوریتمی و کنترل</title><desc id="d">مدل، داده، هدف و قواعد اجرا همگی می‌توانند نتیجهٔ قیمت را تغییر دهند. هدف و قید: هدف را شفاف کن؛ درآمد را همراه با حاشیه، دسترسی و تجربهٔ مشتری بسنج.؛ ویژگی و داده: منبع، تازگی و مجوز داده را بررسی کن؛ متغیر جانشین می‌تواند تبعیض بسازد.؛ آزمون پیش از اجرا: خطا، تفاوت بین گروه‌ها و واکنش رقبا را در محیط محدود بررسی کن.؛ پایش و پاسخ: تغییر قیمت، شکایت و رفتار غیرعادی را ثبت کن؛ مالک و آستانهٔ توقف داشته باش.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">قیمت‌گذاری الگوریتمی و کنترل</text><text x="1150" y="86" text-anchor="end" class="sub">مدل، داده، هدف و قواعد اجرا همگی می‌توانند نتیجهٔ قیمت را تغییر دهند.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">هدف و قید</text><text x="1116" y="240" text-anchor="end" class="b">هدف را شفاف کن؛ درآمد</text><text x="1116" y="270" text-anchor="end" class="b">را همراه با حاشیه،</text><text x="1116" y="300" text-anchor="end" class="b">دسترسی و تجربهٔ مشتری</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">ویژگی و داده</text><text x="556" y="240" text-anchor="end" class="b">منبع، تازگی و مجوز</text><text x="556" y="270" text-anchor="end" class="b">داده را بررسی کن؛</text><text x="556" y="300" text-anchor="end" class="b">متغیر جانشین می‌تواند</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">آزمون پیش از اجرا</text><text x="1116" y="470" text-anchor="end" class="b">خطا، تفاوت بین گروه‌ها</text><text x="1116" y="500" text-anchor="end" class="b">و واکنش رقبا را در</text><text x="1116" y="530" text-anchor="end" class="b">محیط محدود بررسی کن.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">پایش و پاسخ</text><text x="556" y="470" text-anchor="end" class="b">تغییر قیمت، شکایت و</text><text x="556" y="500" text-anchor="end" class="b">رفتار غیرعادی را ثبت</text><text x="556" y="530" text-anchor="end" class="b">کن؛ مالک و آستانهٔ</text></g><text x="1150" y="674" text-anchor="end" class="foot">قیمت‌گذاری شخصی یا خودکار می‌تواند مسئلهٔ حقوقی و اعتماد ایجاد کند؛ قواعد محل فعالیت را بررسی کن.</text></svg>
