<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">برنامهٔ تداوم و تمرین اختلال</title><desc id="d">از خدمت حیاتی تا هشدار، پاسخ، بازیابی و یادگیری، مالک هر گام را مشخص کن. خدمت و اختیار: خدمت ضروری، حداقل ظرفیت و مسئول تصمیم در زمان اختلال را تعیین کن.؛ تریگر و هشدار: نشانه، آستانه و مالک پایش را بنویس؛ هشدار بدون اقدام روشن کافی نیست.؛ پاسخ و بازیابی: اقدام، مسیر جایگزین، زمان هدف و شرط بازگشت عادی را تعریف کن.؛ تمرین و اصلاح: سناریوی میزگردی اجرا کن؛ تصمیم، تأخیر، گلوگاه و اقدام اصلاحی را ثبت کن.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#24324A" flood-opacity=".07"/></filter></defs><style>text{font-family:Vazirmatn,IRANSans,Segoe UI,sans-serif;direction:rtl;unicode-bidi:plaintext;fill:#27364B}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#66758B}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#46566D}.n{font-size:16px;font-weight:700;fill:#506FAE}.foot{font-size:14px;fill:#68768A}</style><rect width="1200" height="720" rx="28" fill="#F8FAFD"/><text x="1150" y="52" text-anchor="end" class="title">برنامهٔ تداوم و تمرین اختلال</text><text x="1150" y="86" text-anchor="end" class="sub">از خدمت حیاتی تا هشدار، پاسخ، بازیابی و یادگیری، مالک هر گام را مشخص کن.</text><g><rect x="620" y="135" width="520" height="200" rx="22" fill="#EAF1FF" stroke="#C9D8F2" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="177" r="20" fill="#FFFFFF" stroke="#C9D8F2"/><text x="662" y="184" text-anchor="middle" class="n">1</text><text x="1116" y="191" text-anchor="end" class="h">خدمت و اختیار</text><text x="1116" y="240" text-anchor="end" class="b">خدمت ضروری، حداقل</text><text x="1116" y="270" text-anchor="end" class="b">ظرفیت و مسئول تصمیم</text><text x="1116" y="300" text-anchor="end" class="b">در زمان اختلال را</text></g><g><rect x="60" y="135" width="520" height="200" rx="22" fill="#F2ECFF" stroke="#D8C9F3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="177" r="20" fill="#FFFFFF" stroke="#D8C9F3"/><text x="102" y="184" text-anchor="middle" class="n">2</text><text x="556" y="191" text-anchor="end" class="h">تریگر و هشدار</text><text x="556" y="240" text-anchor="end" class="b">نشانه، آستانه و مالک</text><text x="556" y="270" text-anchor="end" class="b">پایش را بنویس؛ هشدار</text><text x="556" y="300" text-anchor="end" class="b">بدون اقدام روشن کافی</text></g><g><rect x="620" y="365" width="520" height="200" rx="22" fill="#E8F5ED" stroke="#BFDECA" stroke-width="2" filter="url(#sh)"/><circle cx="662" cy="407" r="20" fill="#FFFFFF" stroke="#BFDECA"/><text x="662" y="414" text-anchor="middle" class="n">3</text><text x="1116" y="421" text-anchor="end" class="h">پاسخ و بازیابی</text><text x="1116" y="470" text-anchor="end" class="b">اقدام، مسیر جایگزین،</text><text x="1116" y="500" text-anchor="end" class="b">زمان هدف و شرط بازگشت</text><text x="1116" y="530" text-anchor="end" class="b">عادی را تعریف کن.</text></g><g><rect x="60" y="365" width="520" height="200" rx="22" fill="#FFF2E3" stroke="#EDD4B3" stroke-width="2" filter="url(#sh)"/><circle cx="102" cy="407" r="20" fill="#FFFFFF" stroke="#EDD4B3"/><text x="102" y="414" text-anchor="middle" class="n">4</text><text x="556" y="421" text-anchor="end" class="h">تمرین و اصلاح</text><text x="556" y="470" text-anchor="end" class="b">سناریوی میزگردی اجرا</text><text x="556" y="500" text-anchor="end" class="b">کن؛ تصمیم، تأخیر،</text><text x="556" y="530" text-anchor="end" class="b">گلوگاه و اقدام اصلاحی</text></g><text x="1150" y="674" text-anchor="end" class="foot">تمرین باید با زمینهٔ سازمان هماهنگ شود؛ مسیر AI و داده هم سناریوی خطا و توقف لازم دارد.</text></svg>
